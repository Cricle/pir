# Track the stable channel. The MSRV itself is enforced two ways: the
# `rust-version = "1.97"` field in Cargo.toml (rustc refuses to build on
# older toolchains) and the dedicated `msrv` CI job, which pins the exact
# toolchain via `dtolnay/rust-toolchain@1.97` (the action exports
# RUSTUP_TOOLCHAIN, which takes precedence over this file).
[toolchain]
channel = "stable"
