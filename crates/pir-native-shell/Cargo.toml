[package]
name = "pir-native-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native Shell desktop front end for pir"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

include = ["/Cargo.toml", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/src/**", "/assets/**"]

[lints.rust]
unsafe_code = "deny"

[lib]
name = "pir_native_shell"
path = "src/lib.rs"

[[bin]]
name = "pir-native-shell"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
# Headless bridge/state APIs; useful for embedding and unit tests without GUI
# system libraries.
headless = []
# Platform adapters are isolated from the shared bridge. NSH's mobile
# backends are only compiled on their native targets; headless GNU builds do
# not pull either backend.
mobile = ["headless", "dep:nsh-platform-ios", "dep:nsh-platform-android"]

# Desktop runner. The backend is deliberately opt-in because GPUI pulls native
# windowing/system dependencies on Linux, macOS, and Windows.
desktop = ["headless", "dep:nsh-engine", "dep:nsh-platform-gpui", "dep:nsh-base"]

[dependencies]
anyhow = "1"
pir-core = { path = "../pir-core", version = "0.3.3", default-features = false, features = ["sdk"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
futures-util = "0.3"

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
nsh-base = { version = "0.6.1", optional = true, default-features = false }
nsh-platform-gpui = { version = "0.6.1", optional = true, default-features = false, features = ["js"] }

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = { version = "0.6.1", optional = true, default-features = false, features = ["embed"] }

[target.'cfg(target_os = "android")'.dependencies]
nsh-platform-android = { version = "0.6.1", optional = true, default-features = false, features = ["js"] }

[dependencies.nsh-engine]
version = "0.6.1"
optional = true
