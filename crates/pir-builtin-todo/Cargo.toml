[package]
name = "pir-builtin-todo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Host-neutral todo domain for the pir coding agent: task state machine, dependency graph, reducer, formatting and session store"
readme = "README.md"
license.workspace = true
authors.workspace = true
repository.workspace = true
include = ["/Cargo.toml", "/README.md", "/src/**", "/tests/**"]

[lints.rust]
unsafe_code = "deny"

[dependencies]
pir-plugin-api = { path = "../pir-plugin-api", version = "0.3.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
