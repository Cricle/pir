[package]
name = "pir-builtin-phone"
version.workspace = true
edition = "2021"
rust-version = "1.97"
description = "Host-neutral pure core of the pir phone builtin: config resolution, URL normalization, quota derivation, relay envelopes"
license.workspace = true
authors.workspace = true
repository.workspace = true
include = ["/Cargo.toml", "/src/**", "/tests/**"]

[lints.rust]
unsafe_code = "deny"

[dependencies]
pir-plugin-api = { path = "../pir-plugin-api", version = "0.3.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
