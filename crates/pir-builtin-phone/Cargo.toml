[package]
name = "pir-builtin-phone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Host-neutral pure core of the pir phone builtin: config resolution, URL normalization, quota derivation, relay envelopes"
readme = "README.md"
license.workspace = true
authors.workspace = true
repository.workspace = true
include = ["/Cargo.toml", "/README.md", "/src/**", "/tests/**"]

[lints.rust]
unsafe_code = "deny"

[dependencies]
pir-plugin-api = { path = "../pir-plugin-api", version = "0.3.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
