[package]
name = "pir-ai-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Provider-neutral AI value types for pir: messages, models, usage, stream options and the assistant event stream (upstream packages/ai/src/types.ts)"
readme = "README.md"
license.workspace = true
authors.workspace = true
repository.workspace = true
include = ["/Cargo.toml", "/README.md", "/src/**", "/tests/**"]

[lints.rust]
unsafe_code = "deny"

[dependencies]
anyhow = "1"
futures-util = "0.3"
pir-telemetry = { path = "../pir-telemetry", version = "0.3.3" }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "form"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# The event-stream suites use `#[tokio::test]`, which needs `macros` plus the
# multi-threaded runtime's parking/time drivers. Kept out of `[dependencies]`
# so a normal build of this crate does not pull them in: the library itself
# only needs `rt`/`sync`/`time`.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
