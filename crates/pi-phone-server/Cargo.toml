[package]
name = "pir-phone-server"
# Inherited from `[workspace.package].version`; do not hardcode a version here.
version.workspace = true
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "Central information proxy for pi-phone sessions"
publish = false

[lib]
name = "pir_phone_server"
path = "src/lib.rs"

[[bin]]
name = "pir-phone-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.23"
bincode = "1.3"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
getrandom = "0.3"
include_dir = "0.7"
mime_guess = "2"
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
