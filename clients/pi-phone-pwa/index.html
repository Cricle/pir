<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Pi Phone</title>
    <script>
      // Apply the saved appearance before the first paint to avoid a flash.
      try {
        var savedTheme = localStorage.getItem("pi-phone-theme") || "system";
        var dark = savedTheme === "dark" || (savedTheme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.setAttribute("content", dark ? "#0a0a0a" : "#fafaf8");
      } catch (_) {}
    </script>
    <script>
      /*
       * Base path for reverse-proxied deployments (Tailscale Serve route
       * /phone-<port>). The server rewrites this placeholder; the default
       * below keeps direct access working.
       */
      window.PI_PHONE_BASE = "/";
    </script>
    <link rel="manifest" href="manifest.webmanifest?v=8" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css?v=8" />
    <link rel="stylesheet" href="shell.css?v=8" />

    <!--
      Critical CSS: instant dark background + composer anchoring before
      styles.css lands, so a cold open never flashes white. The real sheet
      overrides everything below.
    -->
    <style>
      html { background: var(--shell-bg, #0a0a0a); color-scheme: dark; }
      html[data-theme="light"] { background: #fafaf8; color-scheme: light; }
      body { margin: 0; background: var(--shell-bg, #0a0a0a); color: var(--shell-text, #f5f5f5); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      html[data-theme="light"] body { background: #fafaf8; color: #111111; }
      /* Hidden while the real sheet loads; the app shell flips visible on boot. */
      .app-shell:not(.ready) { visibility: hidden; }
      .modal-backdrop.hidden { display: none; }
    </style>

    <!--
      Module preloads: the app is 19 ES modules with a 10-level import chain.
      Without these the browser discovers each level only after the previous
      one parses — a waterfall of round-trips before anything renders. The
      server compresses the whole set to ~54KB, and the service worker keeps
      repeat visits at zero.
    -->
    <link rel="modulepreload" href="app/main.js" />
    <link rel="modulepreload" href="app/theme.js" />
    <link rel="modulepreload" href="app/shell.js" />
    <link rel="modulepreload" href="app/config.js" />
    <link rel="modulepreload" href="app/devices.js" />
    <link rel="modulepreload" href="app/bindings.js" />
    <link rel="modulepreload" href="app/handlers.js" />
    <link rel="modulepreload" href="app/transport.js" />
    <link rel="modulepreload" href="app/ui.js" />
    <link rel="modulepreload" href="app/messages.js" />
    <link rel="modulepreload" href="app/state.js" />
    <link rel="modulepreload" href="app/formatters.js" />
    <link rel="modulepreload" href="app/markdown.js" />
    <link rel="modulepreload" href="app/tool-rendering.js" />
    <link rel="modulepreload" href="app/sheets-view.js" />
    <link rel="modulepreload" href="app/sheet-actions.js" />
    <link rel="modulepreload" href="app/sheet-navigation.js" />
    <link rel="modulepreload" href="app/commands.js" />
    <link rel="modulepreload" href="app/command-catalog.js" />
    <link rel="modulepreload" href="app/autocomplete.js" />
    <link rel="modulepreload" href="app/autocomplete-controller.js" />
    <link rel="modulepreload" href="app/attachments.js" />
    <link rel="modulepreload" href="app/constants.js" />
  </head>
  <body>
    <div class="app-frame">
      <aside id="app-sidebar" class="app-sidebar" aria-label="Sessions and devices">
        <div class="sidebar-brand">
          <div class="brand-mark" aria-hidden="true">π</div>
          <div class="brand-copy">
            <strong>Pi Phone</strong>
          </div>
          <button id="sidebar-close-button" class="icon-button sidebar-close" aria-label="Close sidebar">×</button>
        </div>

        <button type="button" id="sidebar-user" class="sidebar-user" aria-label="Open settings">
          <span class="sidebar-user-avatar" aria-hidden="true">?</span>
          <span>Not signed in</span>
        </button>

        <div id="sidebar-sessions" class="sidebar-section"></div>
        <div id="sidebar-devices" class="sidebar-section"></div>
      </aside>
      <div id="sidebar-scrim" class="sidebar-scrim hidden"></div>

      <div class="app-main">
        <header class="topbar">
          <button
            id="session-sidebar-button"
            class="icon-button"
            aria-label="Open session browser"
            aria-expanded="false"
            title="Sessions"
          >☰</button>
          <button id="page-close-button" class="icon-button page-back hidden" aria-label="Back" title="Back">←</button>

          <button type="button" class="topbar-main" id="session-menu-button" aria-label="Session actions" title="Session actions">
            <span class="topbar-title" id="topbar-title">Pi</span>
            <span class="topbar-sub">
              <span id="status-dot" class="status-dot" aria-hidden="true"></span>
              <span id="connection-pill" class="connection-label">Connecting…</span>
            </span>
          </button>

        </header>

        <div id="chat-view" class="chat-view">
        <div class="app-shell">
      <section id="status-card" class="status-card collapsed">
        <div class="status-grid">
          <div>
            <div class="label">Directory</div>
            <div class="value mono" id="cwd-value">—</div>
          </div>
          <div>
            <div class="label">Session</div>
            <div class="value" id="session-value">—</div>
          </div>
          <div>
            <div class="label">Model</div>
            <div class="value" id="model-value">—</div>
          </div>
          <div>
            <div class="label">Thinking</div>
            <div class="value" id="thinking-value">—</div>
          </div>
          <div>
            <div class="label">State</div>
            <div class="value" id="streaming-value">Idle</div>
          </div>
          <div>
            <div class="label">Server</div>
            <div class="value mono" id="server-value">—</div>
          </div>
        </div>
        <div class="button-row compact">
          <button id="refresh-button" class="secondary">Refresh</button>
          <button id="abort-button" class="danger">Abort</button>
        </div>
      </section>

      <section id="banner" class="banner hidden"></section>
      <section id="widget-stack" class="widget-stack hidden"></section>

      <button id="load-earlier-button" class="load-earlier-button hidden" type="button">Load earlier messages</button>

      <main id="messages" class="messages"></main>

      <!--
        Working indicator: a spinner pinned to the very bottom of the
        transcript while Pi is streaming or running tools. Hidden when idle.
      -->
      <div id="working-indicator" class="working-indicator hidden" aria-live="off" aria-hidden="true">
        <span class="working-spinner" aria-hidden="true"></span>
        <span class="working-label">Working</span>
      </div>
    </div>

    <section class="composer-wrap">
      <div class="composer">
        <input id="image-input" type="file" accept="image/*" multiple class="hidden" />
        <div id="attachment-strip" class="attachment-strip hidden"></div>
        <div id="pending-strip" class="pending-strip hidden"></div>
        <section id="command-strip" class="command-strip hidden"></section>

        <!-- Status strip: working-directory, context/tokens, quota. Sits ABOVE
             the bordered composer box (outside it) so the input keeps a clean
             single-line look; collapses when there is nothing to show. -->
        <div id="quota-row" class="quota-row hidden" aria-live="polite">
          <div id="quota-meta-row" class="quota-meta-row hidden">
            <span id="quota-cwd" class="quota-pill cwd-pill mono"></span>
          </div>
          <div id="quota-pills-row" class="quota-pills-row hidden">
            <span id="quota-context" class="quota-pill quota-context-pill mono hidden"></span>
            <span id="quota-primary" class="quota-pill"></span>
            <span id="quota-secondary" class="quota-pill"></span>
          </div>
        </div>

        <div class="composer-box">
          <div class="composer-input-row">
          <button id="attach-image-button" class="icon-button attach-button" aria-label="Attach an image" title="Attach an image">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M13.4 7.3l-5.2 5.2a3.5 3.5 0 0 1-4.9-4.9l6-6a2.3 2.3 0 0 1 3.3 3.3l-6 6a1.2 1.2 0 0 1-1.7-1.7l5.2-5.2" />
            </svg>
          </button>
          <textarea
            id="prompt-input"
            rows="1"
            maxlength="20000"
            placeholder="Message Pi…"
            autocomplete="off"
            autocapitalize="sentences"
            spellcheck="true"
            enterkeyhint="send"
          ></textarea>
          <button id="stop-button" class="composer-inline-button stop-button danger hidden" aria-label="Stop response" title="Stop response">
            <svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true">
              <rect x="3.5" y="3.5" width="9" height="9" rx="1.5" />
            </svg>
          </button>
          <button id="send-button" class="composer-inline-button send-button" aria-label="Send message" title="Send message">↑</button>
          </div>
        </div>

        <div class="composer-footer">
        <div class="composer-actions">
          <button id="steer-button" class="secondary hidden" title="Steer the current response">Steer</button>
        </div>
        </div>
      </div>
    </section>
        </div>

        <section id="page-view" class="page-view hidden">
          <div class="page-inner">
            <header class="page-head">
              <div>
                <h1 id="page-title" class="page-title">Settings</h1>
                <p id="page-subtitle" class="page-subtitle"></p>
              </div>
            </header>
            <div id="page-content" class="page-content"></div>
          </div>
        </section>
      </div>
    </div>

    <section id="login-modal" class="login-view hidden">
      <div class="login-brand">
        <div class="brand-mark" aria-hidden="true">π</div>
        <strong>Pi Phone</strong>
      </div>
      <div class="login-card">
        <h1>Connect</h1>
        <p>Enter the server URL and your personal access token.</p>
        <label class="login-field">
          <span>Server</span>
          <input id="server-input" type="url" placeholder="https://phone.example.com" autocomplete="url" autocapitalize="none" autocorrect="off" spellcheck="false" />
        </label>
        <label class="login-field">
          <span>Access token</span>
          <input id="token-input" type="password" placeholder="pp_…" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false" />
        </label>
        <button id="token-save-button" class="login-submit">Connect</button>
      </div>
    </section>

    <div id="ui-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="ui-modal-title">
      <div class="modal-card">
        <h2 id="ui-modal-title">Action required</h2>
        <p id="ui-modal-message" class="modal-copy"></p>
        <div id="ui-modal-options" class="option-list"></div>
        <textarea id="ui-modal-input" class="hidden" rows="8"></textarea>
        <div class="button-row" id="ui-modal-buttons"></div>
      </div>
    </div>

    <button id="jump-to-latest-button" class="jump-to-latest-button hidden" type="button" aria-label="Jump to latest message">↓</button>
    <div id="toast-host" class="toast-host"></div>

    <script type="module" src="app.js?v=8"></script>
  </body>
</html>
