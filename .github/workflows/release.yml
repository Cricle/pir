name: Release

# The only release entry point: tags starting with `v` (v0.0.1, v0.1.0-rc.1).
# The tag must equal Cargo.toml's `[package].version` and `.migration-info`
# (checked by the `version` job), so the checked-in Cargo.lock is already
# consistent and the build/publish jobs never rewrite versions.
on:
  push:
    tags:
      - "v*"
  # Manual dispatch exists to RESUME a release whose crates.io publication ran
  # into the registry's rate limit (see `publish` below). It cannot be a tag
  # re-push: that would move a tag whose GitHub Release and binaries already
  # exist. Dispatching runs this workflow file from the default branch (so it
  # carries the current script) while checking out `tag` for the tree to
  # publish, and skips the gate jobs whose success is already recorded.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish crates for (e.g. v0.3.3)"
        required: true
      skip_gates:
        description: "Skip CI/build/GitHub Release: they already succeeded for this tag"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Least privilege: only the `release` job needs write access to publish the
# GitHub Release; build/test/publish only read the checked-out tree. The
# reusable ci.yml declares `checks: write` for its failure annotations, and a
# called workflow may not exceed the caller's grant.
permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Deep in-process nesting in the agent tests needs the larger stack; the
  # release `test` job runs the same suite as CI.
  RUST_MIN_STACK: "8388608"
  # The crates this repository publishes, in dependency order. crates.io
  # rejects a crate whose `version = "x.y.z"` dependencies are not resolvable,
  # so the order is not cosmetic: every name must appear after everything it
  # depends on.
  #
  #   pir-plugin-api      engine-free protocol; no workspace dependencies
  #   pir-protocol        wire protocol (CBOR/framing/schemas); no workspace deps
  #   pir-telemetry       span/metric/trace core; no workspace dependencies
  #   pir-ai-types        AI value types (depends on pir-telemetry)
  #   pir-durable         durable runtime; no workspace dependencies
  #   pir-builtin-*       each depends only on pir-plugin-api + third party
  #   pir-builtins        the aggregate catalog (depends on the builtins)
  #   pir-core            the engine (depends on the catalog + builtins + the
  #                       support crates above)
  #   pir-tui             the terminal front end (depends on pir-core)
  #   pir-sdk             the facade + `pir` binary (depends on core + tui)
  #
  # `pir-sdk` is the *package* name, not `pir`: the `pir` name is owned by an
  # unrelated 2022 project (0.1.0, "A Private Information Retrieval module",
  # verified 2026-10-27). The crate is still imported as `pir` ([lib] name)
  # and the executable is still `pir` ([[bin]] name), so `use pir::...` and
  # `cargo install pir-sdk` (binary: `pir`) are both correct.
  #
  # Not published: `pi-phone-server` and `pir-native-shell` are `publish =
  # false` (an auxiliary relay binary and an experimental shell).
  PUBLISH_ORDER: >-
    pir-plugin-api
    pir-protocol
    pir-telemetry
    pir-ai-types
    pir-durable
    pir-builtin-subagent
    pir-builtin-mode
    pir-builtin-mcp
    pir-builtin-codemode
    pir-builtin-context-mode
    pir-builtin-tool-search
    pir-builtin-tool-repair
    pir-builtin-todo
    pir-builtin-memory
    pir-builtin-phone
    pir-builtins
    pir-core
    pir-tui
    pir-sdk


jobs:
  # Single source of truth for the version. Fails before any toolchain work if
  # the tag does not derive a clean semver version.
  version:
    name: Derive version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
      tag: ${{ steps.derive.outputs.tag }}
    steps:
      # A tag push resolves `ref_name` to the tag; a manual dispatch runs this
      # file from the default branch (so the script being executed is the
      # current one), and names the tag it publishes in `inputs.tag`. Resolve
      # once here and let every later job take the resolved ref, so a resume
      # publishes the SAME tree the tag points at, never the branch tip.
      - name: Resolve release tag
        id: ref
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          if [ -z "$tag" ]; then
            echo "::error title=Missing tag::no `inputs.tag` and no ref name to derive one from"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "resolved release tag: $tag"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - name: Validate ${{ steps.ref.outputs.tag }} as semver
        id: derive
        shell: bash
        env:
          TAG_NAME: ${{ steps.ref.outputs.tag }}
        run: |
          tag="$TAG_NAME"
          case "$tag" in
            v*) ;;
            *)
              echo "::error title=Not a release tag::$tag does not start with 'v'"
              exit 1
              ;;
          esac
          version="${tag#v}"
          # Strict semver (no build metadata: crates.io drops/ignores `+build`,
          # so a tag carrying it would silently become a different version).
          if ! printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "::error title=Invalid release tag::$tag does not derive a semver version (expected vMAJOR.MINOR.PATCH[-PRERELEASE])"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release version: $version (tag $tag)"

      - name: Verify version is the checked-in version
        shell: bash
        run: |
          version="${{ steps.derive.outputs.version }}"
          # Resolve the manifest version the way cargo does, anchored to the
          # owning section: `[package] version = "x.y.z"`, or
          # `[package] version.workspace = true` inheriting
          # `[workspace.package] version`. A bare `sed` over the whole file can
          # silently pick up an unrelated `version = "..."` (dependency tables,
          # `[profile.*]` keys, future manifest sections).
          manifest="$(
            awk '
              /^[[:space:]]*\[/ {
                section = $0
                sub(/^[[:space:]]*\[/, "", section)
                sub(/\][[:space:]]*$/, "", section)
                next
              }
              section == "package" && /^[[:space:]]*version[[:space:]]*=[[:space:]]*"/ {
                value = $0
                sub(/^[^"]*"/, "", value)
                sub(/".*$/, "", value)
                package_version = value
              }
              section == "package" && /^[[:space:]]*version\.workspace[[:space:]]*=[[:space:]]*true[[:space:]]*$/ {
                inherits_workspace = 1
              }
              section == "workspace.package" && /^[[:space:]]*version[[:space:]]*=[[:space:]]*"/ {
                value = $0
                sub(/^[^"]*"/, "", value)
                sub(/".*$/, "", value)
                workspace_version = value
              }
              END {
                if (inherits_workspace) print workspace_version
                else print package_version
              }
            ' Cargo.toml
          )"
          if [ -z "$manifest" ]; then
            echo "::error title=Missing manifest version::Cargo.toml has neither [package] version nor a [workspace.package] version inherited by it."
            exit 1
          fi
          migration="$(sed -n 's/^pir_version=//p' .migration-info | head -n 1)"
          if [ "$manifest" != "$version" ]; then
            echo "::error title=Version mismatch::Cargo.toml has $manifest but tag says $version; bump Cargo.toml before tagging."
            exit 1
          fi
          if [ "$migration" != "$version" ]; then
            echo "::error title=Version mismatch::.migration-info pir_version is $migration but tag says $version."
            exit 1
          fi
          echo "Cargo.toml and .migration-info agree on $version"

      # The builds use `--locked`; catching a stale lock here fails in seconds
      # instead of starting three full platform builds that all die at once.
      - name: Verify Cargo.lock is current
        shell: bash
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null

  ci:
    name: CI (reusable)
    uses: ./.github/workflows/ci.yml
    # A resume dispatch carries `skip_gates`: the CI/build/Release for this tag
    # already happened and re-running them would only delay the crates.
    # A tag push always runs the gates; a resume dispatch can skip them.
    if: ${{ github.event_name == 'push' || inputs.skip_gates != true }}

  build:
    name: Build (${{ matrix.name }})
    needs: [version, ci]
    # A tag push always runs the gates; a resume dispatch can skip them.
    if: ${{ github.event_name == 'push' || inputs.skip_gates != true }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
    env:
      TAG: ${{ needs.version.outputs.tag }}
      # Static musl Linux artifact. The target is musl (not glibc); musl-gcc
      # builds the bundled C dependencies (SQLite, zstd) against musl too.
      # openssl-sys' vendored feature is selected by the target-specific
      # dependency in Cargo.toml; OPENSSL_STATIC keeps the final link static.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      OPENSSL_STATIC: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install musl toolchain
        if: matrix.name == 'linux-x86_64'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}
          cache-on-failure: true
          # Tag builds are one-shot: saving three release-* caches would eat
          # the repository's 10 GB cache budget (and can evict the priority
          # linux-stable-test cache). Restore-only.
          save-if: false

      # No version rewrite step: the `version` job already fails unless the tag
      # equals Cargo.toml and .migration-info, so `Cargo.toml` is the version
      # baked into the binary, `--version`, User-Agent, MCP client and crash
      # logs. `--locked` builds against the committed Cargo.lock (which carries
      # the same version).

      - name: Add Rust targets (macOS universal)
        if: matrix.name == 'macos-universal'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Add Rust target
        if: matrix.name != 'macos-universal'
        run: rustup target add ${{ matrix.target }}

      - name: Build (macOS universal)
        if: matrix.name == 'macos-universal'
        run: |
          cargo build --release --locked --bin pir --target x86_64-apple-darwin
          cargo build --release --locked --bin pir --target aarch64-apple-darwin
          cargo build --release --locked -p pir-phone-server --bin pir-phone-server --target x86_64-apple-darwin
          cargo build --release --locked -p pir-phone-server --bin pir-phone-server --target aarch64-apple-darwin
          lipo -create \
            target/x86_64-apple-darwin/release/pir \
            target/aarch64-apple-darwin/release/pir \
            -output pir
          lipo -create \
            target/x86_64-apple-darwin/release/pir-phone-server \
            target/aarch64-apple-darwin/release/pir-phone-server \
            -output pir-phone-server

      - name: Build
        if: matrix.name != 'macos-universal'
        run: |
          cargo build --release --locked --bin pir --target ${{ matrix.target }}
          cargo build --release --locked -p pir-phone-server --bin pir-phone-server --target ${{ matrix.target }}

      - name: Package (Linux)
        if: matrix.name == 'linux-x86_64'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/pir" dist/pir
          cp "target/${{ matrix.target }}/release/pir-phone-server" dist/pir-phone-server
          cp README.md dist/
          chmod +x dist/pir dist/pir-phone-server
          tar -czf "pir-${TAG}-linux-x86_64-musl.tar.gz" -C dist pir pir-phone-server README.md

      - name: Package (macOS universal)
        if: matrix.name == 'macos-universal'
        run: |
          mkdir -p dist
          cp pir dist/pir
          cp pir-phone-server dist/pir-phone-server
          cp README.md dist/
          chmod +x dist/pir dist/pir-phone-server
          tar -czf "pir-${TAG}-macos-universal.tar.gz" -C dist pir pir-phone-server README.md

      - name: Package (Windows)
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/pir.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/pir-phone-server.exe" dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "pir-${env:TAG}-windows-x86_64.zip"

      # A binary that links is not necessarily a binary that runs: musl and
      # universal builds are easy to break in ways `cargo build` accepts.
      - name: Smoke test (Unix)
        if: matrix.name != 'windows-x86_64'
        shell: bash
        run: |
          ./dist/pir --version | grep -F "${TAG#v}"
          ./dist/pir-phone-server --version | grep -F "${TAG#v}"

      - name: Smoke test (Windows)
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          $out = & ./dist/pir.exe --version
          if (-not ($out -match [regex]::Escape($env:TAG.TrimStart('v')))) {
            throw "unexpected --version output: $out"
          }
          $server = & ./dist/pir-phone-server.exe --version
          if (-not ($server -match [regex]::Escape($env:TAG.TrimStart('v')))) {
            throw "unexpected pir-phone-server --version output: $server"
          }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: pir-${{ matrix.name }}
          path: pir-${{ needs.version.outputs.tag }}-*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    # CI runs first as a reusable workflow; release never repeats lint/test/doctest.
    needs: [version, ci, build]
    # A tag push always runs the gates; a resume dispatch can skip them.
    if: ${{ github.event_name == 'push' || inputs.skip_gates != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}

  # Runs last and on its own: publishing to crates.io is irreversible, so it
  # waits for the build, the test gate AND the GitHub Release to exist.
  #
  # crates.io rate-limits PUBLISHING ITSELF (`rust-lang/crates.io`
  # `src/rate_limiter.rs`, `LimitedAction`): a first-time crate costs a token
  # from a bucket of 5 that refills one token per 10 minutes, while a new
  # version of an existing crate costs one from a bucket of 30 that refills
  # every minute. A release of this workspace is ~18 first-time crates, so a
  # straight loop is throttled at the 6th crate and the remaining 13 need
  # ~130 minutes of refill. That is why this job retries instead of failing:
  # it reads the retry instant from the 429 body, waits, and continues.
  publish:
    name: Publish to crates.io
    needs: [version, ci, build, release]
    # A job whose `needs` were SKIPPED is itself skipped unless the condition
    # uses a status function, so `always()` is required for a resume dispatch
    # (where ci/build/release are skipped but publishing must still happen).
    # `always()` alone would also survive a FAILED gate, so every result is
    # named explicitly: `version` must have succeeded (it always runs), and no
    # gate may have failed. The step below re-checks VERSION for the case where
    # `version` succeeded but produced nothing.
    if: >-
      ${{
        always()
        && !cancelled()
        && needs.version.result == 'success'
        && needs.ci.result != 'failure'
        && needs.build.result != 'failure'
        && needs.release.result != 'failure'
      }}
    runs-on: ubuntu-latest
    # 13 crates * 10 min of NEW-crate refill + 30 s of index polling each, plus
    # one `cargo publish` verification build per crate. 240 min covers a full
    # first-time workspace release with headroom; the default 90 was less than
    # the refill time alone.
    timeout-minutes: 240
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      # The tree published must be the one the tag points at, not the branch a
      # resume dispatch was launched from.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      # No rust-cache here: `cargo publish`'s verification build happens in
      # `target/package/<crate>-<version>/`, a fresh target dir that the
      # workspace cache cannot seed. The `version` job has already proven that
      # tag == Cargo.toml == .migration-info, so no version rewrite is needed.

      # Idempotency: re-running a release (or re-tagging a version that a
      # previous attempt published) must not fail the run, and a partially
      # published release must resume: every crate is probed individually.
      #
      # `crates.io` accepts an upload only once the index has served the
      # previous crate's version, so after each successful publish the loop
      # polls the index for the crate it just uploaded before moving on.
      #
      # RATE LIMITING IS PART OF THE CONTRACT, not an error path. A publish is
      # charged against a per-user token bucket (`rust-lang/crates.io`
      # `src/rate_limiter.rs`): a FIRST-TIME crate takes from a bucket of 5
      # that refills one token every 10 minutes, a new version of an existing
      # crate from a bucket of 30 that refills every minute. This workspace
      # release has ~18 first-time crates, so crates 6..18 are published one
      # per 10 minutes; the 429 body carries the exact instant the next token
      # exists ("Please try again after ..."), so the loop sleeps until then
      # instead of failing. Only a 429 that names no instant is fatal.
      - name: Publish crates in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error title=Missing token::the CARGO_REGISTRY_TOKEN secret is not set"
            exit 1
          fi
          # `always()` above keeps this job alive when the gate jobs were
          # SKIPPED (a resume dispatch), but it also survives a FAILED
          # `version` job — where VERSION would be empty and every probe would
          # ask crates.io for `/<crate>/` and get a 404 it reads as "safe to
          # publish". Fail before that can happen.
          if [ -z "${VERSION}" ]; then
            echo "::error title=No version::the version job did not produce a version; nothing to publish"
            exit 1
          fi
          user_agent="${GITHUB_REPOSITORY} release workflow (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY})"
          # The longest a single rate-limit wait may ask for. Refill for a new
          # crate is 10 minutes; anything far beyond that means the response
          # was not a plain rate limit and should not be slept through.
          max_wait_seconds=1800

          # 200 = published already, 404 = safe to publish, anything else aborts
          # (a 5xx must not be mistaken for "not published yet").
          probe() {
            local name="$1" code
            code="$(curl -sS -o /dev/null -w '%{http_code}' -A "$user_agent" \
              "https://crates.io/api/v1/crates/${name}/${VERSION}")"
            case "$code" in
              200) return 0 ;;
              404) return 1 ;;
              *)
                echo "::error title=crates.io probe failed::GET ${name}/${VERSION} returned HTTP ${code}"
                return 2
                ;;
            esac
          }

          # Seconds to sleep before retrying, when a publish was rate-limited.
          # Prints nothing and returns 1 when the text carries no retry instant.
          #
          # The server's message is
          #   You have published too many new crates in a short period of time.
          #   Please try again after Fri, 27 Nov 2026 11:26:33 GMT and see ...
          # and there is no Retry-After header, so the instant is parsed from
          # the body. `date -d` understands that exact RFC-1123 form.
          rate_limit_delay() {
            local text="$1" stamp target now
            stamp="$(printf '%s' "$text" \
              | grep -oE 'try again after [^.]*GMT' \
              | sed 's/^try again after //' | head -n 1)"
            [ -n "$stamp" ] || return 1
            target="$(date -u -d "$stamp" +%s 2>/dev/null)" || return 1
            now="$(date -u +%s)"
            # +5s of slack: the server's clock and this runner's are not the
            # same clock, and an early retry costs a whole extra 10 minutes.
            echo $(( target - now + 5 ))
          }

          # Publish one crate, waiting out a rate limit. `cargo publish` is the
          # only thing that talks to the registry's write endpoint; its stderr
          # is captured so a 429 can be told apart from a real failure.
          publish_with_retry() {
            local name="$1" attempt=1 output ready delay
            while : ; do
              set +e
              output="$(cargo publish -p "$name" --locked --allow-dirty \
                --token "$CARGO_REGISTRY_TOKEN" 2>&1)"
              ready=$?
              set -e
              if [ "$ready" -eq 0 ]; then
                printf '%s\n' "$output"
                return 0
              fi
              if ! printf '%s' "$output" | grep -qi 'too many.*\(crates\|requests\)'; then
                printf '%s\n' "$output"
                echo "::error title=Publish failed::${name} ${VERSION} failed for a reason other than rate limiting"
                return 1
              fi
              if ! delay="$(rate_limit_delay "$output")"; then
                printf '%s\n' "$output"
                echo "::error title=Rate limited::${name} ${VERSION} was rate-limited and the response named no retry instant"
                return 1
              fi
              if [ "$delay" -gt "$max_wait_seconds" ]; then
                printf '%s\n' "$output"
                echo "::error title=Rate limited::${name} ${VERSION} needs ${delay}s, more than the ${max_wait_seconds}s this job will wait"
                return 1
              fi
              if [ "$delay" -lt 0 ]; then delay=1; fi
              echo "::warning title=crates.io rate limit::${name} ${VERSION} attempt ${attempt} was throttled; retrying in ${delay}s"
              # `date` above is UTC so the log states the wake-up explicitly.
              echo "  sleeping until $(date -u -d "@$(( $(date -u +%s) + delay ))" '+%H:%M:%S UTC')"
              sleep "$delay"
              attempt=$(( attempt + 1 ))
            done
          }

          # crates.io rejects a .crate at or above 10,000,000 bytes; package the
          # exact archive `cargo publish` will build before uploading it.
          size_guard() {
            local name="$1" crate_file bytes
            cargo package --no-verify --allow-dirty --locked -p "$name"
            crate_file="target/package/${name}-${VERSION}.crate"
            if [ ! -f "$crate_file" ]; then
              echo "::error title=Unexpected package filename::$crate_file was not produced"
              exit 1
            fi
            bytes=$(stat -c%s "$crate_file")
            echo "  package: $crate_file ($bytes bytes)"
            if [ "$bytes" -ge 10000000 ]; then
              echo "::error title=Crate too large::$crate_file is $bytes bytes; the crates.io limit is 10,000,000"
              exit 1
            fi
          }

          # The registry index serves a version with a short delay; without this
          # wait, the next crate's dependency resolution fails with
          # "no matching package named ...".
          wait_for_index() {
            local name="$1" attempt
            for attempt in $(seq 1 30); do
              sleep 5
              if probe "$name"; then
                echo "  ${name} ${VERSION} is on the index"
                return 0
              fi
              echo "  waiting for the index to serve ${name} ${VERSION} (attempt ${attempt}/30)"
            done
            echo "::error title=Index propagation timed out::${name} ${VERSION} was not visible after 150s"
            exit 1
          }

          for crate in $PUBLISH_ORDER; do
            echo "::group::${crate} ${VERSION}"
            status=0
            probe "$crate" || status=$?
            if [ "$status" -eq 0 ]; then
              echo "::notice title=Already published::${crate} ${VERSION} is already on crates.io; skipping."
            elif [ "$status" -eq 1 ]; then
              size_guard "$crate"
              publish_with_retry "$crate"
              wait_for_index "$crate"
            else
              exit 1
            fi
            echo "::endgroup::"
          done
          echo "::notice title=Published::${VERSION} is on crates.io for all $(printf '%s\n' $PUBLISH_ORDER | wc -l) crates"

