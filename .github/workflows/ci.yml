name: CI

# Speed-first split (no duplicated full gate):
# - lint (Linux): fmt, clippy --all-targets --all-features, SDK no-default
#   feature matrix, doctests, and the offline SDK examples. One runner, one
#   target dir: the example builds reuse the lint compile artifacts.
# - test (Windows): the full nextest suite, eight sequential groups. This
#   primary platform runs the complete suite after one bounded prebuild.
# - test-linux-subset (Linux): lib + bins only (plus a type-check of all
#   tests). Catches Linux-only runtime regressions without paying for the
#   full integration suite twice.
# - test-macos (macOS): all-target check plus selected merged TUI smoke tests;
#   it is a platform smoke lane, not a second full-suite lane.
# Benchmarks are MANUAL ONLY (`scripts/run_benchmarks.sh`, dev profile): CI
# compiles them through clippy --all-targets but never runs them — criterion
# wall-clock numbers are meaningless on a shared runner.
on:
  push:
    branches: [master]
    tags-ignore: ["v*"]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - ".gitignore"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # `::error` workflow commands become check-run annotations; they are
  # dropped when the job token cannot write checks.
  checks: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_MIN_STACK: "8388608"

jobs:
  lint:
    name: Lint + SDK matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-lint
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        shell: bash
        run: |
          # GitHub's `shell: bash` runs with `-e`: disable errexit around the
          # lint so the failure branch below (summary + annotations) actually
          # executes instead of the step dying on the pipeline status. Keep it
          # off for the whole script — the diagnostic pipelines may exit
          # non-zero (grep with no match) and must not abort the annotations.
          set +e
          cargo clippy --workspace --exclude pir-native-shell --all-targets --all-features --locked -- -D warnings 2>&1 | tee /tmp/clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Clippy failure'
              echo '```'
              tail -120 /tmp/clippy.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Surface the first diagnostics as annotations too: they are
            # readable through the checks API without downloading the job log.
            sed -r 's/\x1b\[[0-9;]*[mK]//g' /tmp/clippy.log | grep -E -A3 '^error(\[|:)' | head -80 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=Clippy::$line"
            done
            # A failure with NO `^error` line (a cargo/rustc panic, an OOM, a
            # runner-level fault) leaves the annotations empty and the log
            # unreachable without downloading it. Always annotate the raw
            # tail as one escaped message so the checks API alone shows WHY.
            # Workflow commands need %/CR/LF escaped; 6 KiB keeps it under the
            # command limit.
            tail -c 6000 /tmp/clippy.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | awk '{printf "%s%%0A", $0}' | cut -c1-60000 > /tmp/clippy-tail.txt
            echo "::error title=Clippy log tail::$(cat /tmp/clippy-tail.txt)"
            # Environment snapshot for the empty-log case: the size and the
            # runner resources distinguish a silent OOM/disk fault from a
            # compiler panic whose text never reached the log.
            {
              echo "status=$status log_bytes=$(wc -c < /tmp/clippy.log)"
              df -h / /tmp 2>/dev/null | tail -2
              free -m 2>/dev/null | head -2
              cargo --version 2>&1
              rustc --version 2>&1
              uname -sm 2>&1
              sudo dmesg 2>/dev/null | tail -6
            } | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | awk '{printf "%s%%0A", $0}' | cut -c1-20000 > /tmp/clippy-env.txt
            echo "::error title=Clippy env::$(cat /tmp/clippy-env.txt)"
          fi
          exit "$status"
      - name: SDK feature matrix (no-default-features)
        shell: bash
        run: |
          set -euo pipefail
          # The embedder surface must build without the default `full` set.
          # This is the shape examples/ and external SDK consumers use; it
          # caught the `tail_page`/print-only helpers that leaked into the
          # no-session build.
          for features in "sdk" "sdk,session" "sdk,print" "sdk,session,print"; do
            echo "==> --no-default-features --features $features"
            cargo check --lib --locked --no-default-features --features "$features"
          done
      - name: Doctests
        run: cargo test --workspace --exclude pir-native-shell --doc --locked
      - name: SDK examples (offline set; the script checks the example set first)
        run: bash scripts/run_examples.sh

  test:
    name: Tests (full suite)
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Use a short temp directory (Windows)
        shell: bash
        run: |
          mkdir -p /c/tmp
          echo "TEMP=C:\\tmp" >> "$GITHUB_ENV"
          echo "TMP=C:\\tmp" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-test
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install nextest
        uses: taiki-e/install-action@cargo-nextest
      # The eight-group step below enumerates `pir-sdk`'s integration targets,
      # so it never runs another workspace crate's own tests. The builtin
      # implementation crates and the plugin protocol carry the pure-logic
      # suites (tokenization/BM25, the repair pipeline, the todo domain, the
      # bridge mapping), so they get their own run: without it those tests are
      # compiled by `--all-targets` but never executed.
      #
      # `pir-phone-server` is here for the same reason and was the one member
      # missing: it is `publish = false`, so it is excluded from the release
      # publish order, but its six integration suites and the relay unit
      # suites never ran in CI — only `scripts/phone_server_check.sh`, which no
      # gate invokes. `pir-native-shell` stays excluded with the rest of this
      # workflow (it needs the opt-in `desktop`/GPUI backend).
      #
      # nextest is also what makes two process-global test fixtures reliable,
      # because it gives every test its own process:
      #   * `bash_eviction_utf8::eviction_cut_lands_on_a_utf8_boundary`
      #     re-points TMP/TEMP/TMPDIR at a regular file to force spill creation
      #     to fail, which would break any concurrently running suite; it gates
      #     itself on NEXTEST_RUN_ID and SKIPs under plain `cargo test --test`.
      #   * `plugin_services_hardening::has_auth_serves_warm_cache...` and
      #     `mcp_integration::reload_leaves_connections_lazy...` need the
      #     process-global PIR_AGENT_DIR to stay put for their whole run.
      # Keep the `--test zz_merged_*` groups on nextest for that reason; running
      # them with plain `cargo test` reintroduces the shared-process races
      # documented in TEST-2 (`.audit/review-2026-11-23/findings.jsonl`).
      - name: Workspace crate tests (plugin api, builtins, engine, TUI, relay)
        shell: bash
        run: |
          set +e
          cargo nextest run --locked --profile ci \
            -p pir-plugin-api \
            -p pir-telemetry \
            -p pir-ai-types \
            -p pir-durable \
            -p pir-protocol \
            -p pir-builtins \
            -p pir-builtin-subagent \
            -p pir-builtin-mode \
            -p pir-builtin-mcp \
            -p pir-builtin-codemode \
            -p pir-builtin-context-mode \
            -p pir-builtin-tool-search \
            -p pir-builtin-tool-repair \
            -p pir-builtin-todo \
            -p pir-builtin-memory \
            -p pir-builtin-phone \
            -p pir-tui \
            -p pir-core \
            -p pir-phone-server 2>&1 | tee /tmp/nextest-crates.log
          status=${PIPESTATUS[0]}
          echo "::notice title=Workspace crate tests::exit=${status}"
          if [ "$status" -ne 0 ]; then
            {
              echo '### Workspace crate tests failed'
              echo '```'
              tail -120 /tmp/nextest-crates.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            sed -r 's/\x1b\[[0-9;]*[mK]//g' /tmp/nextest-crates.log | grep -E -A6 '^\s*(FAIL|error(\[|:))' | head -80 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=Workspace crate test::$line"
            done
          fi
          exit "$status"
      - name: Tests (eight sequential groups; per-group binary cleanup)
        shell: bash
        run: |
          # GitHub's `shell: bash` runs with `-e`; disable errexit or the first
          # failing nextest group exits the whole step immediately. That skips
          # both the per-group `::notice` and the failure annotations below,
          # turning a normal test failure into a silent exit 100 with no clue
          # in the checks API. The loop records failures and exits once at the
          # end instead.
          set +e
          set -uo pipefail
          status=0
          # `autotests = false` means tests/*.rs are modules inside the generated
          # zz_merged_N harnesses, not cargo test targets. Enumerate the real
          # targets from cargo metadata (jq ships on the hosted runners); fall
          # back to the generated harness names when jq is unavailable.
          if command -v jq >/dev/null 2>&1; then
            mapfile -t targets < <(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "pir-sdk") | .targets[] | select(.kind[] == "test") | .name' \
              | tr -d '\r')
          else
            targets=(
              zz_merged_1 zz_merged_2 zz_merged_3 zz_merged_4
              zz_merged_5 zz_merged_6 zz_merged_7 zz_merged_8
              worker_threads_real g_durable_integration
              print_native_session resume_on_error
              feature_off_surface sdk_consumer_surface sdk_consumer_embed rpc_export_off
            )
          fi
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "no integration test targets found"
            exit 1
          fi
          echo "integration test targets: ${targets[*]}"
          echo "prebuilding all test targets once for parallel linking"
          CARGO_INCREMENTAL=0 cargo test --no-run --tests --locked
          prebuild_status=$?
          if [ "$prebuild_status" -ne 0 ]; then
            echo "test target prebuild failed: $prebuild_status"
            exit "$prebuild_status"
          fi
          for shard in 1 2 3 4 5 6 7 8; do
            args=()
            if [ "$shard" -eq 1 ]; then args+=("--lib" "--bins"); fi
            i=0
            for name in "${targets[@]}"; do
              if [ $((i % 8)) -eq $((shard - 1)) ]; then
                args+=("--test" "$name")
              fi
              i=$((i + 1))
            done
            echo "test group ${shard}/8: ${#args[@]} selectors over ${#targets[@]} targets"
            # Record a failure but keep going: stopping at the first red group
            # hides every later group's result, turning one flake into a
            # misleading "suite never ran" red build. The group log is kept
            # for the failure annotations below (the job log needs a token to
            # read; annotations do not).
            group_log="/tmp/nextest-group-${shard}.log"
            cargo nextest run --locked --profile ci "${args[@]}" 2>&1 | tee "$group_log"
            group_exit=${PIPESTATUS[0]}
            echo "::notice title=Nextest group ${shard}::exit=${group_exit}"
            if [ "$group_exit" -ne 0 ]; then
              status=1
              # Strip ANSI so the annotation greps also match colored nextest
              # output, and so the check-run text is readable.
              sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' "$group_log" > "$group_log.clean" || cp "$group_log" "$group_log.clean"
              {
                echo "### Test group ${shard}/8 failed (exit ${group_exit})"
                echo '```'
                grep -E "^\s*(FAIL|TIMEOUT)|^ *Summary|^error" "$group_log.clean" | head -60
                tail -30 "$group_log.clean"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              grep -E "^\s*(FAIL|TIMEOUT)" "$group_log.clean" | head -20 | while IFS= read -r line; do
                [ -n "$line" ] && echo "::error title=Nextest group ${shard}::$line"
              done
              tail -c 4000 "$group_log.clean" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
                | awk '{printf "%s%%0A", $0}' | cut -c1-40000 > /tmp/nextest-group-tail.txt
              echo "::error title=Nextest group ${shard} log tail::$(cat /tmp/nextest-group-tail.txt)"
            fi
            # Each group links ~10 GiB of test binaries. Drop only THIS group's
            # linked executables; keep the pir-sdk rlib and shared dependency
            # artifacts, which are identical for every group.
            i=0
            for name in "${targets[@]}"; do
              if [ $((i % 8)) -eq $((shard - 1)) ]; then
                rm -f "target/debug/deps/${name}-"* "target/debug/deps/${name}.d"
              fi
              i=$((i + 1))
            done
          done
          exit "$status"

  test-linux-subset:
    name: Linux lib + bins
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-subset
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install nextest
        uses: taiki-e/install-action@cargo-nextest
      - name: Lib + bin unit tests
        # `--workspace` is load-bearing: this is a non-virtual workspace whose
        # default members are `pir-sdk` alone, so without it the support
        # crates' lib tests never run on Linux.
        run: cargo nextest run --workspace --exclude pir-native-shell --lib --bins --locked --profile ci
      - name: Type-check every integration test (Linux)
        run: cargo check --workspace --exclude pir-native-shell --tests --locked

  test-macos:
    name: macOS check + TUI smoke
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-check
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Cargo check all targets
        run: cargo check --workspace --exclude pir-native-shell --all-targets --locked
      - name: TUI and cross-platform smoke tests
        shell: bash
        # Each filter must name the harness that actually CONTAINS the module:
        # libtest exits 0 on an empty filter match, so a wrong harness name is
        # a silently green lane rather than a failure. Keep these in sync with
        # `scripts/gen_merged_tests.ps1` when a module moves.
        run: |
          cargo test --locked --test zz_merged_2 tui_input_order
          cargo test --locked --test zz_merged_1 tui_render_parity
          cargo test --locked --test zz_merged_5 tui_dirty_refresh
