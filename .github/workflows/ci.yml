name: CI

# Speed-first split (no duplicated full gate):
# - lint (Linux): fmt, clippy --all-targets --all-features, SDK no-default
#   feature matrix, doctests, and the offline SDK examples. One runner, one
#   target dir: the example builds reuse the lint compile artifacts.
# - test (Windows): the full nextest suite, eight sequential groups. This is
#   the primary platform and the only place the whole suite runs.
# - test-linux-subset (Linux): lib + bins only (plus a type-check of all
#   tests). Catches Linux-only runtime regressions without paying for the
#   full integration suite twice.
# Benchmarks are MANUAL ONLY (`scripts/run_benchmarks.sh`, dev profile): CI
# compiles them through clippy --all-targets but never runs them — criterion
# wall-clock numbers are meaningless on a shared runner.
on:
  push:
    branches: [master]
    tags-ignore: ["v*"]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - ".gitignore"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # `::error` workflow commands become check-run annotations; they are
  # dropped when the job token cannot write checks.
  checks: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_MIN_STACK: "8388608"

jobs:
  lint:
    name: Lint + SDK matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-lint
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets --all-features --locked -- -D warnings 2>&1 | tee /tmp/clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Clippy failure'
              echo '```'
              tail -120 /tmp/clippy.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Surface the first diagnostics as annotations too: they are
            # readable through the checks API without downloading the job log.
            sed -r 's/\x1b\[[0-9;]*[mK]//g' /tmp/clippy.log | grep -E -A3 '^error(\[|:)' | head -80 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=Clippy::$line"
            done
            # A failure with NO `^error` line (a cargo/rustc panic, an OOM, a
            # runner-level fault) leaves the annotations empty and the log
            # unreachable without downloading it. Always annotate the raw
            # tail as one escaped message so the checks API alone shows WHY.
            # Workflow commands need %/CR/LF escaped; 6 KiB keeps it under the
            # command limit.
            tail -c 6000 /tmp/clippy.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | awk '{printf "%s%%0A", $0}' | cut -c1-60000 > /tmp/clippy-tail.txt
            echo "::error title=Clippy log tail::$(cat /tmp/clippy-tail.txt)"
            # Environment snapshot for the empty-log case: the size and the
            # runner resources distinguish a silent OOM/disk fault from a
            # compiler panic whose text never reached the log.
            {
              echo "status=$status log_bytes=$(wc -c < /tmp/clippy.log)"
              df -h / /tmp 2>/dev/null | tail -2
              free -m 2>/dev/null | head -2
              cargo --version 2>&1
              rustc --version 2>&1
              uname -sm 2>&1
              sudo dmesg 2>/dev/null | tail -6
            } | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | awk '{printf "%s%%0A", $0}' | cut -c1-20000 > /tmp/clippy-env.txt
            echo "::error title=Clippy env::$(cat /tmp/clippy-env.txt)"
          fi
          exit "$status"
      - name: SDK feature matrix (no-default-features)
        shell: bash
        run: |
          set -euo pipefail
          # The embedder surface must build without the default `full` set.
          # This is the shape examples/ and external SDK consumers use; it
          # caught the `tail_page`/print-only helpers that leaked into the
          # no-session build.
          for features in "sdk" "sdk,session" "sdk,print" "sdk,session,print"; do
            echo "==> --no-default-features --features $features"
            cargo check --lib --locked --no-default-features --features "$features"
          done
      - name: Doctests
        run: cargo test --doc --locked
      - name: SDK examples (offline set; the script checks the example set first)
        run: bash scripts/run_examples.sh

  test:
    name: Tests (full suite)
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Use a short temp directory (Windows)
        shell: bash
        run: |
          mkdir -p /c/tmp
          echo "TEMP=C:\\tmp" >> "$GITHUB_ENV"
          echo "TMP=C:\\tmp" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-test
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install nextest
        uses: taiki-e/install-action@cargo-nextest
      - name: Tests (eight sequential groups; per-group binary cleanup)
        shell: bash
        run: |
          set -uo pipefail
          status=0
          # `autotests = false` means tests/*.rs are modules inside the generated
          # zz_merged_N harnesses, not cargo test targets. Enumerate the real
          # targets from cargo metadata (jq ships on the hosted runners); fall
          # back to the generated harness names when jq is unavailable.
          if command -v jq >/dev/null 2>&1; then
            mapfile -t targets < <(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "pir-sdk") | .targets[] | select(.kind[] == "test") | .name' \
              | tr -d '\r')
          else
            targets=()
            for f in tests/zz_merged_*.rs; do
              targets+=("$(basename "$f" .rs)")
            done
          fi
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "no integration test targets found"
            exit 1
          fi
          echo "integration test targets: ${targets[*]}"
          for shard in 1 2 3 4 5 6 7 8; do
            args=()
            if [ "$shard" -eq 1 ]; then args+=("--lib" "--bins"); fi
            i=0
            for name in "${targets[@]}"; do
              if [ $((i % 8)) -eq $((shard - 1)) ]; then
                args+=("--test" "$name")
              fi
              i=$((i + 1))
            done
            echo "test group ${shard}/8: ${#args[@]} selectors over ${#targets[@]} targets"
            # Record a failure but keep going: stopping at the first red group
            # hides every later group's result, turning one flake into a
            # misleading "suite never ran" red build.
            if ! cargo nextest run --locked --profile ci "${args[@]}"; then
              status=1
            fi
            # Each group links ~10 GiB of test binaries. Drop only THIS group's
            # linked executables; keep the pir-sdk rlib and shared dependency
            # artifacts, which are identical for every group.
            i=0
            for name in "${targets[@]}"; do
              if [ $((i % 8)) -eq $((shard - 1)) ]; then
                rm -f "target/debug/deps/${name}-"* "target/debug/deps/${name}.d"
              fi
              i=$((i + 1))
            done
          done
          exit "$status"

  test-linux-subset:
    name: Linux lib + bins
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-subset
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install nextest
        uses: taiki-e/install-action@cargo-nextest
      - name: Lib + bin unit tests
        run: cargo nextest run --lib --bins --locked --profile ci
      - name: Type-check every integration test (Linux)
        run: cargo check --tests --locked
