[package]
# The crates.io *package* name. It is not `pir`: that name is owned by an
# unrelated 2022 project (a "Private Information Retrieval module"), so this
# crate publishes as `pir-sdk`. The crate is still imported as `pir`
# ([lib] name below) and the executable is still `pir` ([[bin]] name), so
# `use pir::...` and `cargo install pir-sdk` (binary: `pir`) are both correct.
#
# Layout: this package is the *facade* — it re-exports `pir-core` (the engine)
# under the historical `pir::...` paths and, with the `tui` feature, re-exports
# `pir-tui` as `pir::tui`. Embedders keep depending on this single crate; the
# engine has no terminal dependencies and a new front end is a new crate that
# depends on `pir-core` (see `docs/architecture.md`).
name = "pir-sdk"
# Single source of truth for the crate/binary version is `[workspace.package]`
# at the bottom of this file; every workspace member inherits it via
# `version.workspace = true`. pir uses its own semver; `.migration-info`
# records the upstream pi mapping.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Integration-test auto-discovery is disabled on purpose: every tests/*.rs
# file used to be its own test target, and each one statically linked the
# whole engine. scripts/gen_merged_tests.ps1 folds them into 8 generated
# tests/zz_merged_N.rs harnesses (explicit [[test]] entries at the end of
# this file). Run it after adding/removing a tests/*.rs file.
autotests = false
description = "Pi coding agent, reimagined in Rust"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
# docs.rs indexes crates by *package* name, so this follows [package].name
# (`pir-sdk`), not the `pir` library name.
documentation = "https://docs.rs/pir-sdk"
keywords = ["coding-agent", "agent", "cli", "llm", "ai"]
categories = ["command-line-utilities", "development-tools"]

# Files shipped in the crates.io package (`cargo package` / `cargo publish`).
#
# `include` (not `exclude`) is deliberate: with an include list cargo never
# consults the VCS to enumerate files, so local build trees (`target/`,
# `target-lane-*/`), `logs/`, editor droppings and the eval-harness artifacts
# can never leak into the .crate even when the worktree is dirty or the checkout
# has no commits (measured 2026-10-27: the default VCS-based list enumerated
# 32,446 files, including target-lane-*/ build output).
#
#   src/**       the facade + the `pir` binary; the engine is `pir-core` and
#                the terminal UI is `pir-tui` (both are published separately
#                and referenced by versioned path dependencies). The embedded
#                JS shims and agent presets live in `crates/pir-core/assets/`
#                and ship with that crate.
#   examples/**  the documented SDK examples (they are part of the crate's
#                public documentation and are built by `cargo package`).
#   benches/**   the criterion bench (dev-dependency; type-checked by CI).
#   schemas/**   the committed JSON-schema artifacts (small; referenced by the
#                docs and regenerated by src/schema.rs).
#   README/CHANGELOG are the prose files crates.io renders; LICENSE-MIT and
#   LICENSE-APACHE are shipped so consumers receive the dual-license texts
#   (`license = "MIT OR Apache-2.0"` above).
#
# Deliberately excluded: tests/ (12.9 MB, 269 targets — not needed to build the
# published crate), docs/ (site markdown; only docs/sdk.md is shipped for the
# README link), scripts/, and every target*/logs/ directory.
include = [
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/src/**",
    "/examples/**",
    "/benches/**",
    "/schemas/*.json",
    "/docs/sdk.md",
]

[[bin]]
name = "pir"
path = "src/main.rs"
# `cli` is the true minimum for the executable: it provides the print/JSON
# front end and the core loop. The built-in tools are their own aggregate
# `tools` feature (NOT implied by `cli`), so `--features cli` builds a real
# toolless `pir`; TUI/RPC/server/MCP/extensions are separately gated
# (`docs/FEATURES.md` documents the slim profiles); omitting `cli` builds only
# the library.
required-features = ["cli"]

# Test-only stdio MCP fixture. Keeping it a tiny bin (instead of re-executing
# a 300+ MB integration-test binary for every mock server) is what makes the
# MCP/g_agent suites fast enough for the one-minute local gate. It has no
# production code path and is never built by `--bin pir`.
[[bin]]
name = "pir-mock-mcp"
path = "tests/support/mock_mcp_server.rs"
required-features = ["mcp"]

# The minimal profile's executable front end. It declares NO required
# features on purpose: `cargo build --no-default-features` must still produce
# a runnable agent (`pir::minimal::MinimalAgent` is core, the binary is a thin
# flag/REPL wrapper). `--features full` also builds it, but the shipped `pir`
# binary and every existing public API are unchanged.
[[bin]]
name = "pir-minimal"
path = "src/bin/pir-minimal.rs"
required-features = []

# The AOT bytecode generator: compiles every embedded JS shim to QuickJS
# bytecode (`scripts/gen_shims_bytecode.*` drives it). Not shipped — it exists
# so the checked-in `assets/bytecode` blobs can be regenerated and verified.
[[bin]]
name = "pir-gen-bytecode"
path = "src/bin/pir_gen_bytecode.rs"
required-features = ["extensions"]

[lib]
name = "pir"
path = "src/lib.rs"

# Examples. Each declares the MINIMAL feature set its own documented command
# uses: `sdk` for every example, plus `session` for the examples that
# write/attach transcript files (`sessions`, `session_lifecycle`,
# `session_compaction`), `tools` for `mini_coding`, `subagent` for `builtin`,
# `extensions` for `extension`, and the common `sdk,session,skills` set for
# `real_endpoint` (it needs a wire adapter only at runtime — build with the
# `provider-*` feature for the protocol you target). Declaring the requirement
# keeps slim `--all-targets` / `--examples` builds from trying to compile an
# example whose features are off (cargo then skips the target instead of
# failing) and keeps the trimming honest: `--features sdk` builds the offline
# core examples, `sdk,session` adds `sessions`, and each optional example adds
# exactly its own feature.
[[example]]
name = "builtin"
path = "examples/builtin.rs"
required-features = ["sdk", "subagent"]

[[example]]
name = "builtins_matrix"
path = "examples/builtins_matrix.rs"
required-features = ["sdk", "session", "tools", "todo", "memory", "tool-search", "tool-repair", "subagent"]

[[example]]
name = "control"
path = "examples/control.rs"
required-features = ["sdk"]

# The two durable examples use the `pir::durable` surface, which since the
# 2026-11-25 extraction is the default-on `durable` feature (the separate
# `pir-durable` crate). They declare it so the aggregate `--examples` sweep
# builds them under the default feature set and skips them (rather than
# failing) under a slim `--no-default-features` build.
[[example]]
name = "dev_durable_reports"
path = "examples/dev_durable_reports.rs"
required-features = ["durable"]

[[example]]
name = "dev_durable_timers"
path = "examples/dev_durable_timers.rs"
required-features = ["durable"]

[[example]]
name = "extension"
path = "examples/extension.rs"
required-features = ["sdk", "extensions"]

# PIR-SDK-018 live-tail soak: a real persisted session with
# `live_session_tail`, so it needs `session` for the measurement to be
# meaningful (without it every session mode is the documented in-memory stub).
[[example]]
name = "live_tail_soak"
path = "examples/live_tail_soak.rs"
required-features = ["sdk", "session"]

[[example]]
name = "mini_coding"
path = "examples/mini_coding.rs"
required-features = ["sdk", "tools"]

# PROTOCOL v6 mmap/COW prototype: the only dependency is `memmap2`, which the
# `session` feature owns (`pir-core/Cargo.toml` `session = ["dep:memmap2"]`).
# Nothing from `pir` is used, so `sdk` is not needed.
[[example]]
name = "mmap_cow_probe"
path = "examples/mmap_cow_probe.rs"
required-features = ["session"]

[[example]]
name = "plugin"
path = "examples/plugin.rs"
required-features = ["sdk"]

[[example]]
name = "phone_relay_demo"
path = "examples/phone_relay_demo.rs"
required-features = ["phone"]

[[example]]
name = "proxy"
path = "examples/proxy.rs"
required-features = ["sdk"]

[[example]]
name = "quickstart"
path = "examples/quickstart.rs"
required-features = ["sdk"]

[[example]]
name = "real_endpoint"
path = "examples/real_endpoint.rs"
required-features = ["sdk", "session", "skills"]

[[example]]
name = "session_compaction"
path = "examples/session_compaction.rs"
required-features = ["sdk", "session"]

[[example]]
name = "session_lifecycle"
path = "examples/session_lifecycle.rs"
required-features = ["sdk", "session"]

[[example]]
name = "sessions"
path = "examples/sessions.rs"
required-features = ["sdk", "session"]

[[example]]
name = "sdk_error_paths"
path = "examples/sdk_error_paths.rs"
required-features = ["sdk"]

[[example]]
name = "streaming"
path = "examples/streaming.rs"
required-features = ["sdk"]

# R54 whole-history read probes: they open/create real session files through
# `SessionManager`, so they need the `session` persistence feature.
[[example]]
name = "transcript_copy_probe"
path = "examples/transcript_copy_probe.rs"
required-features = ["session"]

[[example]]
name = "transcript_large_probe"
path = "examples/transcript_large_probe.rs"
required-features = ["sdk", "session"]

[[example]]
name = "tools"
path = "examples/tools.rs"
# `tools` is optional: enable it to also see the built-in coding tools in the
# merged registry. Without it the example still runs with its custom tools.
required-features = ["sdk"]

[dependencies]
# The facade proper: the engine plus (optionally) the terminal front end.
# Every feature below forwards to these crates; the facade adds no
# dependencies of its own beyond what the `pir` binary needs to bootstrap.
pir-core = { path = "crates/pir-core", version = "0.3.2", default-features = false }
pir-tui = { path = "crates/pir-tui", version = "0.3.2", optional = true }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "sync", "time", "fs", "process", "signal"] }
clap = { version = "4", features = ["derive", "env"], optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The AOT bytecode generator (`pir-gen-bytecode`) compiles the embedded shims
# with rquickjs directly; nothing else in this facade crate touches the engine.
# The feature set matches `pir-core`'s edge so Cargo resolves one shape.
rquickjs = { version = "0.14.0", features = [
    "futures",
    "loader",
    "parallel",
    "disable-assertions",
], optional = true }
# Optional process-wide allocator for allocator A/B runs (feature
# `mimalloc-alloc`, OFF by default). `default-features = false` selects plain
# mimalloc; the `pir` bin registers `mimalloc::MiMalloc` as its
# `#[global_allocator]`. A build without the feature keeps the previous setup.
mimalloc = { version = "0.1", optional = true, default-features = false }

[features]
# Today's behavior = `full` (every feature). The bin requires only `cli`
# (see `[[bin]]`). `--no-default-features` keeps the engine's minimal agent
# (`pir-core`), so a library-only build is still runnable via `pir::minimal`.
#
# Front-end split: `tui` enables `pir-tui` (the terminal front end). The
# engine never depends on it; another UI is another crate + another feature.
default = ["full"]
full = [
    "tui",
    "durable",
    "extensions",
    "context-mode",
    "mcp",
    "python",
    "env",
    "env-daemon",
    "server",
    "subagent",
    "tool-repair",
    "tool-search",
    "todo",
    "memory",
    "phone",
    "provider-openai",
    "provider-anthropic",
    "provider-google",
    "provider-bedrock",
    "provider-mistral",
    "cli",
    "tools",
    "grep-find",
    "image-tools",
    "image-protocol",
    "mcp-sd",
    "brush",
    "session",
    "skills",
    "sdk",
    "client",
    # Empty profile marker; `full` is still the union of every feature.
    "minimal",
]

# ---------------------------------------------------------------------------
# Engine features (forwarded to pir-core)
# ---------------------------------------------------------------------------
# The durable runtime (a separate crate re-exported at `pir::durable`).
durable = ["pir-core/durable"]
session = ["pir-core/session", "pir-tui?/session"]
skills = ["pir-core/skills"]
sdk = ["pir-core/sdk"]
minimal = ["pir-core/minimal"]
provider-openai = ["pir-core/provider-openai"]
provider-anthropic = ["pir-core/provider-anthropic"]
provider-google = ["pir-core/provider-google"]
provider-bedrock = ["pir-core/provider-bedrock"]
provider-mistral = ["pir-core/provider-mistral"]
image-tools = ["pir-core/image-tools", "image-resize"]
# The `image` codec for the model-facing resize pipeline. Implied by
# `image-tools`; exposed separately for an embed that wants only the resize
# helpers (the TUI also enables the engine-side feature directly).
image-resize = ["pir-core/image-resize"]
cli = ["pir-core/cli", "dep:clap"]
print = ["pir-core/print"]
rpc = ["pir-core/rpc"]
export-html = ["pir-core/export-html"]
tool-read = ["pir-core/tool-read"]
tool-bash = ["pir-core/tool-bash"]
tool-powershell = ["pir-core/tool-powershell"]
tool-edit = ["pir-core/tool-edit"]
tool-write = ["pir-core/tool-write"]
tool-ls = ["pir-core/tool-ls"]
tool-background = ["pir-core/tool-background"]
# The aggregate must ALSO enable the leaf features on this crate: integration
# tests compile against `pir-sdk` and gate on `cfg(feature = "tool-read")` etc.,
# so an aggregate that only forwarded `pir-core/tools` left those cfgs false and
# compiled compiled-out-build tests into a full build.
tools = [
    "pir-core/tools",
    "tool-read",
    "tool-bash",
    "tool-powershell",
    "tool-edit",
    "tool-write",
    "tool-ls",
    "tool-background",
]
grep-find = ["pir-core/grep-find"]
extensions = ["pir-core/extensions", "pir-tui?/extensions", "dep:rquickjs"]
brush = ["pir-core/brush"]
context-mode = ["pir-core/context-mode"]
# The `python` tool name is kept for Settings/tool-selection compatibility; the
# tool now runs JavaScript on the embedded QuickJS runtime.
python = ["pir-core/python"]
# Allocator A/B switch for the `pir` binary only (`src/main.rs`). OFF by
# default: enabling it swaps the process-wide allocator, which is what the
# perf harness compares against the default.
mimalloc-alloc = ["dep:mimalloc"]
mcp = ["pir-core/mcp"]
mcp-sd = ["pir-core/mcp-sd"]
env = ["pir-core/env"]
env-daemon = ["pir-core/env-daemon"]
server = ["pir-core/server"]
client = ["pir-core/client"]
subagent = ["pir-core/subagent"]
# Alias of `subagent` (see `pir-core/Cargo.toml`): the foreman/plan modes need
# the subagent tool, and the explicit name keeps one feature per builtin.
mode = ["subagent"]
tool-repair = ["pir-core/tool-repair"]
tool-search = ["pir-core/tool-search"]
todo = ["pir-core/todo"]
memory = ["pir-core/memory"]
phone = ["pir-core/phone"]
# Test-only: `pir-telemetry`'s in-memory recorder (`TestTelemetry`). The
# integration suites under `tests/` reach it through `pir::telemetry`; the
# workspace dev-dependencies enable it, production builds never do.
telemetry-testing = ["pir-core/telemetry-testing"]

# a pir-sdk dependency or published facade feature; build it directly with
# `cargo build -p pir-native-shell --features desktop`.

# Terminal UI: crossterm loop, editor, renderers, clipboard, theme watching.
# `export-html` follows because the TUI's `/export` command renders a session.
tui = ["dep:pir-tui", "export-html", "pir-core/image-resize", "pir-core/ui-support", "image-resize"]
# The halfblocks/image-protocol renderer inside the TUI.
image-protocol = ["tui", "pir-tui/image-protocol"]

# Quality gates: CI runs `cargo clippy --all-targets --all-features -- -D
# warnings`, so every `warn` entry here is a build gate.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
disallowed_methods = "warn"
disallowed_types = "warn"
wildcard_dependencies = "warn"
negative_feature_names = "warn"
missing_const_for_thread_local = "allow"

[dev-dependencies]
# Tests and examples were written against the pre-split single crate and use
# the engine's third-party crates directly. They are dev-only: a consumer of
# `pir-sdk` does not pull them in.
#
# `testing` is enabled here (not in any published feature): the integration
# suites construct `pir::telemetry::TestTelemetry`, and a dev-dependency
# feature-union makes that available to `cargo test` without putting the
# in-memory recorder in a release build.
pir-telemetry = { path = "crates/pir-telemetry", features = ["testing"] }
criterion = "0.5"
pir-phone-server = { path = "crates/pi-phone-server" }
dhat = "0.3"
insta = { version = "1", features = ["json"] }
proptest = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "form", "native-tls"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "native-tls"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.13.1"
memmap2 = "0.9"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
sha2 = "0.10"
hmac = "0.12"
md-5 = "0.10"
sha1 = "0.10"
getrandom = "0.3"
pbkdf2 = "0.12"
flate2 = "1.1"
brotli = "8"
zstd = "0.13"
cm-memory = { version = "0.3.1", default-features = false }
rsa = { version = "0.9", features = ["sha2"] }
ciborium = "0.2.2"
unicode-width = "0.2.2"
unicode-segmentation = "1.13"
similar = "2"
memchr = "2"
unicode-normalization = "0.1"
swc_ecma_parser = "46.0.0"
swc_ecma_codegen = "32.0.3"
swc_ecma_ast = "29.0.2"
swc_ecma_transforms_base = "50.0.0"
swc_ecma_transforms_typescript = "56.0.0"
swc_common = "26.0.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
grep-searcher = "0.1"
grep-regex = "0.1"
ignore = "0.4"
encoding_rs = "0.8"
notify = "8.2"
tokio-util = "0.7"
strum = { version = "0.27", features = ["derive"] }
derive_more = { version = "2", features = ["display", "from"] }
globset = "0.4"
semver = "1"
textwrap = { version = "0.15", default-features = false, features = ["unicode-width", "unicode-linebreak"] }
rmcp = { version = "3.5", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest-native-tls",
    "server",
    "transport-io",
] }
aes = "0.8"
scrypt = "0.11"
rusqlite = { version = "0.31", features = ["bundled"] }
brush-core = "0.5.0"
brush-builtins = "0.2.0"
crossterm = "0.29.0"
arboard = { version = "3", default-features = false, features = ["image-data"] }
mermaid-text = "0.57"

[target.'cfg(unix)'.dev-dependencies]
# Integration tests (`env_client_pty.rs`) probe processes with libc directly.
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
crossterm_winapi = "0.9"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics",
    "Win32_System_Diagnostics_Debug",
] }

[package.metadata.cargo-machete]
# The package is `md-5`; the code imports its crate as `md5` (node:crypto
# hash/hmac backend), which cargo-machete cannot see as a package use.
# `openssl-sys` is target-only: the musl release enables its `vendored` feature
# for native-tls, with no Rust-side import.
ignored = ["md-5", "openssl-sys"]

# Criterion owns `main` (its own runner + report); without `harness = false`
# cargo compiles the bench under libtest and runs 0 benchmarks.
[[bench]]
name = "benchmark"
harness = false

[[bench]]
name = "sdk_benchmark"
harness = false

# Standalone SQLite trigram-vs-LIKE evaluation harness (PIR-BIN-021 follow-up,
# lane-builtin cycle77). Not a criterion bench: a plain binary driven by the
# corpus/out dirs on the command line, so the numbers stay reproducible.
[[example]]
name = "trigram_bench"
path = "bench/trigram_bench/main.rs"
required-features = ["context-mode"]

[profile.release]
opt-level = 3
# THIN LTO, not fat. `strip = true` removes symbols only. Deliberately NOT
# used: `panic = "abort"` (both
# `extensions/runtime/host_functions/worker_fns.rs` and `tui/autocomplete.rs`
# contain a panicking boundary, and `coding_agent/crash_log.rs` installs a
# `panic::set_hook`, so unwinding is load-bearing).
#
# Why thin: fat LTO + one codegen unit serializes the whole crate graph through
# a single LLVM module, which dominated every release build (8m51s recorded in
# `scripts/GATE-README.md` gate 11) and made a one-line engine edit pay the
# entire link. `thin` still cross-crate inlines (it is a superset of plain
# per-CGU inlining) and parallelizes the link; the size difference between thin
# and fat LTO on this tree is low single-digit percent. `codegen-units = 4`
# rather than 1 for the same reason: one CGU forces serial codegen and disables
# thin LTO's pipeline. `release-size` / `release-balanced` inherit this, so they
# get thin too.
lto = "thin"
codegen-units = 4
strip = true

# Size-first profile: identical features and behaviour, LLVM optimizes for
# size. Build with `cargo build --profile release-size --bin pir`.
#
# Measured on x86_64-pc-windows-gnu, `--bin pir`, this tree:
#   release      73,700,864 B
#   release-size 66,945,024 B   (-9.17%, -6.76 MB)
# `.text` shrinks by 6.4 MB (61.4 MB -> 54.8 MB) and `.rdata` by 0.25 MB; the
# rest of the win is the same in both profiles, so the shipped size tracks the
# code sections directly.
#
# COST: the "s" crates lose instruction-level parallelism, and the QuickJS C
# runtime is the worst hit (that is why rquickjs* sits in the opt-level 3
# list below). Do not use this profile for the JavaScript-heavy interactive
# paths without re-measuring; `release-balanced` is the conservative choice.
#
# `strip` is repeated here on purpose. `inherits = "release"` did NOT carry it
# into the produced binary on this toolchain (cargo 1.99.1): a release-size
# build emitted 88,791,040 B with 167,844 COFF symbols still in the table, and
# an external `strip --strip-all` brought the very same artifact to
# 66,945,024 B. Spelling it out costs nothing and keeps the profile honest.
[profile.release-size]
inherits = "release"
opt-level = "s"
strip = true

[profile.release-size.package.pir-sdk]
opt-level = 3
[profile.release-size.package.pir-core]
opt-level = 3
[profile.release-size.package.pir-tui]
opt-level = 3

[profile.release-size.package.rquickjs]
opt-level = 3
[profile.release-size.package.rquickjs-core]
opt-level = 3
[profile.release-size.package.rquickjs-sys]
opt-level = 3

[profile.release-size.package.regex]
opt-level = 3
[profile.release-size.package.regex-automata]
opt-level = 3
[profile.release-size.package.regex-syntax]
opt-level = 3
[profile.release-size.package.memchr]
opt-level = 3
[profile.release-size.package.grep-matcher]
opt-level = 3
[profile.release-size.package.grep-regex]
opt-level = 3
[profile.release-size.package.grep-searcher]
opt-level = 3
[profile.release-size.package.ignore]
opt-level = 3
[profile.release-size.package.globset]
opt-level = 3

[profile.release-size.package.serde_json]
opt-level = 3
[profile.release-size.package.tokio]
opt-level = 3

# The three hot paths the original whitelist missed. `opt-level = "s"` on
# these is where the "slower" part of the size win came from, not the cold
# bulk: every provider request goes through the HTTP/TLS stack, every TUI
# frame through crossterm, and every transcript/settings/tool payload
# through serde. At "s" they trade measurable throughput for a few MB that
# the genuinely cold crates (swc, brush, image codecs, MCP) give up for
# free, because none of those run on a per-token or per-frame path.
[profile.release-size.package.serde]
opt-level = 3
[profile.release-size.package.serde_derive]
opt-level = 3
[profile.release-size.package.reqwest]
opt-level = 3
[profile.release-size.package.hyper]
opt-level = 3
[profile.release-size.package.hyper-util]
opt-level = 3
[profile.release-size.package.rustls]
opt-level = 3
[profile.release-size.package.crossterm]
opt-level = 3

[profile.release-size.package.futures-util]
opt-level = 3
[profile.release-size.package.parking_lot]
opt-level = 3

# Middle ground: every crate at opt-level 2. Not re-measured on this tree; the
# only recorded number (79,790,080 B, -3.46% vs release at the time, JavaScript
# +4.1% wall) predates the thin-LTO + codegen-units=4 change above and the
# `release` baseline it compared against is now 73,700,864 B, so treat the
# percentage as indicative rather than current. Pick this profile when the
# embedded JavaScript loops matter more than the last few megabytes and you
# want a much shorter build than `release-size` (opt-level 2 keeps LLVM's
# vectorizer and inliner fully on, so it is also the mildest throughput hit).
[profile.release-balanced]
inherits = "release"
opt-level = 2

# No debuginfo in dev: the crate links ~14 test binaries, and line tables
# pushed each to ~80 MB — a lib edit (including any `.js.txt` include_str!)
# meant re-linking ~8 GB, dominating the edit-test loop. Panic locations and
# assert messages are unaffected (they are compiled-in constants); only
# RUST_BACKTRACE symbolization loses file:line. Raise to 1/2 when chasing a
# crash that needs symbolized backtraces.
#
# `strip = "debuginfo"` on top of `debug = 0`: `debug = 0` removes DWARF but
# NOT the COFF symbol table, which is what actually dominates these binaries
# (measured on `zz_merged_7`: 249 MB -> 139 MB, 44% smaller; the code sections
# end at 145 MB of the original file). That table is pure linker I/O on every
# relink, so stripping it is the single biggest edit-test-loop win here. Tests
# are unaffected — no suite asserts on symbolized backtraces (crash_log's
# `stack` is a caller-supplied string), verified by re-running the stripped
# harness (892 passed). "debuginfo" and not "symbols" so a future `debug = 1`
# still works as documented above.
[profile.dev]
opt-level = 0
debug = 0
strip = "debuginfo"

[workspace]
members = [
    "crates/pir-core",
    "crates/pir-tui",
    "crates/pi-phone-server",
    "crates/pir-native-shell",
    "crates/pir-plugin-api",
    "crates/pir-telemetry",
    "crates/pir-ai-types",
    "crates/pir-durable",
    "crates/pir-protocol",
    "crates/pir-builtins",
    "crates/pir-builtin-tool-repair",
    "crates/pir-builtin-todo",
    "crates/pir-builtin-tool-search",
    "crates/pir-builtin-mode",
    "crates/pir-builtin-memory",
    "crates/pir-builtin-context-mode",
    "crates/pir-builtin-codemode",
    "crates/pir-builtin-mcp",
    "crates/pir-builtin-phone",
    "crates/pir-builtin-subagent",
]
resolver = "2"

# Single source of truth for the workspace version. Every member inherits it
# with `version.workspace = true`, so a release bump is one edit here (plus
# `.migration-info`, which the release workflow cross-checks against the tag).
# Keep the spelling exactly `version = "x.y.z[-PRERELEASE]"` on one line: the
# release workflow parses this section (prereleases like `0.3.2-rc.1` are valid).
[workspace.package]
version = "0.3.2"
# Language/toolchain contract for the whole workspace. Every member inherits
# these via `edition.workspace = true` / `rust-version.workspace = true`, so a
# bump is one edit here instead of twenty.
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
authors = ["Earendil Works <team@earendil.works>"]
repository = "https://github.com/Cricle/pir"

# BEGIN GENERATED MERGED TEST TARGETS
# Regenerated by scripts/gen_merged_tests.ps1; every root tests/*.rs file is
# included by exactly one harness module. autotests = false above stops
# cargo from also building each original file as its own target.
[[test]]
name = "zz_merged_1"
path = "tests/zz_merged_1.rs"

[[test]]
name = "zz_merged_2"
path = "tests/zz_merged_2.rs"

