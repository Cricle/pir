# Test builds disable debug assertions: the integration harnesses assert their
# own invariants, and the overflow checks in every (large) test binary were a
# measurable part of the gate's runtime. Kept from the node-AOT branch so both
# trees agree on the test profile.
[profile.test]
debug-assertions = false
