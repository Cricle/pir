[package]
# The crates.io *package* name. It is not `pir`: that name is owned by an
# unrelated 2022 project (a "Private Information Retrieval module"), so this
# crate publishes as `pir-sdk`. The crate is still imported as `pir`
# ([lib] name below) and the executable is still `pir` ([[bin]] name), so
# `use pir::...` and `cargo install pir-sdk` (binary: `pir`) are both correct.
name = "pir-sdk"
# Single source of truth for the crate/binary version. pir uses its own semver;
# .migration-info records the upstream pi mapping (0.0.1 = pi 1.4.0).
version = "0.0.1"
edition = "2021"
rust-version = "1.97"
description = "Pi coding agent, reimagined in Rust"
license = "MIT OR Apache-2.0"
authors = ["Earendil Works <team@earendil.works>"]
repository = "https://github.com/earendil-works/pir"
readme = "README.md"
# docs.rs indexes crates by *package* name, so this follows [package].name
# (`pir-sdk`), not the `pir` library name.
documentation = "https://docs.rs/pir-sdk"
keywords = ["coding-agent", "agent", "cli", "llm", "ai"]
categories = ["command-line-utilities", "development-tools"]

# Files shipped in the crates.io package (`cargo package` / `cargo publish`).
#
# `include` (not `exclude`) is deliberate: with an include list cargo never
# consults the VCS to enumerate files, so local build trees (`target/`,
# `target-lane-*/`), `logs/`, editor droppings and the eval-harness artifacts
# can never leak into the .crate even when the worktree is dirty or the checkout
# has no commits (measured 2026-10-27: the default VCS-based list enumerated
# 32,446 files, including target-lane-*/ build output).
#
#   src/**       the crate; the provider catalog JSON under src/ai/catalog is
#                pulled in with include_str!.
#   assets/**    REQUIRED at compile time: node_shims.rs `include_bytes!`s
#                assets/shims/*.js.txt.deflate. Dropping this directory breaks
#                the build of the published crate.
#   examples/**  the documented SDK examples (they are part of the crate's
#                public documentation and are built by `cargo package`).
#   benches/**   the criterion bench (dev-dependency; type-checked by CI).
#   schemas/**   the committed JSON-schema artifacts (small; referenced by the
#                docs and regenerated by src/schema.rs).
#   README/CHANGELOG are the prose files crates.io renders; LICENSE-MIT and
#   LICENSE-APACHE are shipped so consumers receive the dual-license texts
#   (`license = "MIT OR Apache-2.0"` above).
#
# Deliberately excluded: tests/ (12.9 MB, 269 targets — not needed to build the
# published crate; including it would more than double package size and make
# `cargo publish` verification compile the whole suite), docs/ (site
# markdown; only docs/sdk.md is shipped for the README link), scripts/,
# schemas notes, and every target*/logs/ directory.
#
# Every pattern is `/`-anchored: cargo's include patterns are gitignore-style,
# so a bare `README.md` would also match scripts/**/README.md and every other
# README in the tree (verified with `cargo package --list`).
include = [
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/src/**",
    "/assets/**",
    "/examples/**",
    "/benches/**",
    "/schemas/*.json",
    "/docs/sdk.md",
]

[[bin]]
name = "pir"
path = "src/main.rs"
# `cli` is the true minimum for the executable: it provides the print/JSON
# front end and the core loop. The built-in tools are their own aggregate
# `tools` feature (NOT implied by `cli`), so `--features cli` builds a real
# toolless `pir`; TUI/RPC/server/MCP/extensions are separately gated
# (`docs/FEATURES.md` documents the slim profiles); omitting `cli` builds only
# the library.
required-features = ["cli"]

# Test-only stdio MCP fixture. Keeping it a tiny bin (instead of re-executing
# a 300+ MB integration-test binary for every mock server) is what makes the
# MCP/g_agent suites fast enough for the one-minute local gate. It has no
# production code path and is never built by `--bin pir`.
[[bin]]
name = "pir-mock-mcp"
path = "tests/support/mock_mcp_server.rs"
required-features = ["mcp"]

[lib]
name = "pir"
path = "src/lib.rs"

# Examples. Each declares the MINIMAL feature set its own documented command
# uses: `sdk` for every example, plus `session` for `sessions` (the only one
# that writes/attaches transcript files), `subagent` for `builtin`,
# `extensions` for `extension`, and the common `sdk,session,skills` set for
# `real_endpoint` (it needs a wire adapter only at runtime — build with the
# `provider-*` feature for the protocol you target). Declaring the requirement
# keeps slim `--all-targets` / `--examples` builds from trying to compile an
# example whose features are off (cargo then skips the target instead of
# failing) and keeps the trimming honest: `--features sdk` builds the offline
# core examples, `sdk,session` adds `sessions`, and each optional example adds
# exactly its own feature.
[[example]]
name = "builtin"
path = "examples/builtin.rs"
required-features = ["sdk", "subagent"]

[[example]]
name = "control"
path = "examples/control.rs"
required-features = ["sdk"]

[[example]]
name = "extension"
path = "examples/extension.rs"
required-features = ["sdk", "extensions"]

[[example]]
name = "plugin"
path = "examples/plugin.rs"
required-features = ["sdk"]

[[example]]
name = "proxy"
path = "examples/proxy.rs"
required-features = ["sdk"]

[[example]]
name = "quickstart"
path = "examples/quickstart.rs"
required-features = ["sdk"]

[[example]]
name = "real_endpoint"
path = "examples/real_endpoint.rs"
required-features = ["sdk", "session", "skills"]

[[example]]
name = "sessions"
path = "examples/sessions.rs"
required-features = ["sdk", "session"]

[[example]]
name = "streaming"
path = "examples/streaming.rs"
required-features = ["sdk"]

[[example]]
name = "tools"
path = "examples/tools.rs"
# `tools` is optional: enable it to also see the built-in coding tools in the
# merged registry. Without it the example still runs with its custom tools.
required-features = ["sdk"]

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "sync", "time", "fs", "process", "signal"] }
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "form", "native-tls"] }
# Codex ChatGPT transport: upstream pools a WebSocket and sends
# `previous_response_id` continuations instead of resending full history.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "native-tls"], optional = true }
futures-util = "0.3"
tracing = "0.1"
regex = "1.13.1"
# Read-only memory maps for the session-file open path: a huge session is
# tail-paged (scan backwards from the end) and the bytes the parser walks come
# from the page cache instead of a heap buffer, so opening a 100 MB session
# never copies the file. 0.9.11 is already in the lock as a transitive dep (the
# notify/ignore stack), so this introduces no new external crate to compile.
memmap2 = "0.9"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# 0.23 shares the tree's single base64 (reqwest/rmcp/swc/hyper-util already
# pull 0.23.1); the Engine API (engine::general_purpose::{STANDARD,URL_SAFE*})
# is unchanged between 0.22 and 0.23, so this dedupes one compiled crate.
base64 = "0.23"
sha2 = "0.10"
# AWS SigV4 request signing for the Bedrock ConverseStream adapter; also the
# HMAC backend for the node:crypto shim (hmac ops).
hmac = { version = "0.12", optional = true }
# Direct hash backends for the node:crypto shim's hash/hmac ops. md-5/sha1
# already ride the lock as transitive deps (0.10.x); pinning the same minor
# range reuses the existing lock entries instead of introducing duplicates.
md-5 = { version = "0.10", optional = true }
sha1 = { version = "0.10", optional = true }
# Entropy for the node:crypto shim's randomBytes/randomUUID (0.3 lock line).
getrandom = "0.3"
# PBKDF2 behind the node:crypto shim's pbkdf2Sync (default `hmac` feature
# reuses the hmac/sha1/sha2 lock lines above; no new transitive deps).
pbkdf2 = { version = "0.12", optional = true }
# gzip/deflate codec behind the node:zlib shim (src/extensions/runtime/
# host_functions/child_fns.rs). Default (miniz_oxide) backend keeps the tree
# pure Rust; the 1.1 lock line already carries flate2's transitive deps.
flate2 = { version = "1.1", optional = true }
# Brotli + Zstandard codecs behind the same node:zlib host op table: Node's
# convenience-method surface (brotliCompress / zstdCompress + the *Sync and
# stream-constructor forms) is what test-zlib-convenience-methods exercises,
# and flate2 alone leaves it one throw away from green. `brotli` is pure Rust
# (compressor + decompressor); `zstd` rides zstd-sys' bundled C source, built
# by the `cc` crate with the MSVC toolset the tree already links against.
brotli = { version = "8", optional = true }
zstd = { version = "0.13", optional = true }
# RS256 (RSA PKCS#1 v1.5 + SHA-256) signing for the Google Vertex
# service-account OAuth2 JWT (pure Rust; no OpenSSL/native deps).
rsa = { version = "0.9", features = ["sha2"], optional = true }
ciborium = "0.2.2"
# TUI-only dependencies (feature `tui`): the terminal event loop and renderers.
crossterm = { version = "0.29.0", optional = true }
unicode-width = "0.2.2"
# Grapheme-cluster segmentation for the TUI width/cursor layer (UAX #29
# extended clusters: ZWJ emoji, flags, skin tones, keycaps, combining marks).
# Rust's `Intl.Segmenter` equivalent, already in the lock as a transitive dep
# (MIT/Apache-2.0) — this promotes it to a direct dependency edge only.
unicode-segmentation = { version = "1.13", optional = true }
# Mermaid code-block rendering (src/tui/mermaid.rs): the ecosystem Unicode
# box-drawing renderer that replaced the hand-written grok-mermaid port.
# Clean tree: MIT, MSRV 1.92, three deps (ascii-dag, chrono, unicode-width).
mermaid-text = { version = "0.57", optional = true }
similar = "2"
unicode-normalization = "0.1"
# Extension runtime (feature `extensions`): QuickJS + the swc transpile stack.
rquickjs = { version = "0.14.0", features = ["futures", "loader"], optional = true }
swc_ecma_parser = { version = "46.0.0", optional = true }
swc_ecma_codegen = { version = "32.0.3", optional = true }
swc_ecma_ast = { version = "29.0.2", optional = true }
swc_ecma_transforms_base = { version = "50.0.0", optional = true }
swc_ecma_transforms_typescript = { version = "56.0.0", optional = true }
swc_common = { version = "26.0.0", optional = true }
arboard = { version = "3", default-features = false, features = ["image-data"], optional = true }
# Inline image support for the read tool and the halfblocks preview
# (decode/resize/encode; promoted from an image-protocol-only optional dep).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"], optional = true }
# ripgrep's search engine (the same crates the `rg` binary is built from):
# the grep tool searches in-process instead of spawning an external `rg`.
grep-searcher = { version = "0.1", optional = true }
grep-regex = { version = "0.1", optional = true }
# ripgrep's directory walker with gitignore-glob overrides (the `ignore`
# crate 鈥?ripgrep/fd's own engine 鈥?run in-process by the find and grep
# tools; glob matching rides its OverrideBuilder, no standalone globset dep).
ignore = { version = "0.4", optional = true }
# `pir env-daemon` (src/env_daemon/, the built-in pi-env protocol-v1 daemon):
# WHATWG UTF-8 stream decoding for command output, matching Node's
# `new TextDecoder().decode(...)` (upstream packages/env/daemon/src/decode.rs).
# Already in the dependency graph (reqwest/encoding_rs_io ride 0.8.42), so this
# is a direct-dependency edge, not a new lock line.
encoding_rs = "0.8"
# `pir env-daemon` watch operation: the same native watcher (inotify/FSEvents/
# ReadDirectoryChangesW) the upstream daemon uses, with the client-visible
# polling fallback handled in src/env_daemon/watch.rs. Upstream pins 8.2.0.
notify = { version = "8.2", optional = true }
# Await-able cancellation (CancellationToken) behind the AbortSignal type 鈥?
# replaces the first-slice 50 ms polling loops (bash abort, cache-warmer watcher).
tokio-util = "0.7"
# Enum <-> str plumbing and Display/From derives (quality wave: replaces
# hand-written as_str/from_str/Display three-piece impls).
strum = { version = "0.27", features = ["derive"] }
derive_more = { version = "2", features = ["display", "from"] }
# Glob matching for model/tool patterns. Already in the lock through `ignore`
# (ripgrep's walker), so this is a direct-dependency edge, not a new crate.
# Replaces the hand-rolled `glob_matches` matcher (backtracking, no `**`
# semantics, no escape handling).
globset = "0.4"
# Version comparison for the update-check/`--version` paths (upstream uses
# `semver` semantics). Already in the lock as a transitive edge.
semver = "1"
# Text wrapping/indent helpers for the TUI. Pinned to the 0.15 line already in
# the lock (rustpython-doc), not 0.16: 0.16's unicode-linebreak feature pulls
# the icu_segmenter data tables (~1 MB of binary and a long compile), which the
# tree deliberately avoids. 0.15 uses the light smawk/unicode-linebreak pair.
textwrap = { version = "0.15", default-features = false, features = ["unicode-width", "unicode-linebreak"] }
# Official Model Context Protocol SDK (modelcontextprotocol/rust-sdk). The MCP
# client layer is built on it: rmcp owns the JSON-RPC 2.0 framing, the
# initialize handshake + protocol version negotiation, request correlation,
# and both wire transports (child-process stdio and streamable HTTP with SSE).
rmcp = { version = "3.5", default-features = false, optional = true, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest-native-tls",
    # Server side: the built-in `sd` (search & replace) MCP server runs as a
    # stdio server hosted by the `pir` executable itself.
    "server",
    "transport-io",
] }
# Embedded RustPython 3 (pure-Rust Python) behind the `python` builtin tool
# (src/plugins/builtin/python.rs). Component crates instead of the `rustpython`
# meta-crate: the meta crate unconditionally pulls clap 2, env_logger 0.9,
# rustyline 14 and dirs-next for its REPL binary. Feature posture:
# threading/ssl/jit OFF (no native threads / TLS backends / cranelift);
# `freeze-stdlib` compiles the pure-Python stdlib (rustpython-pylib Lib/) into
# the binary so imports never touch a system Python (binary-size trade-off
# accepted by the user). NOTE for cargo-deny: the tree pulls malachite-bigint
# (LGPL-3.0-only, RustPython's bigint backend) — see deny.toml follow-up.
rustpython-vm = { version = "0.4.0", default-features = false, features = ["compiler", "freeze-stdlib"], optional = true }
rustpython-stdlib = { version = "0.4.0", default-features = false, features = ["compiler"], optional = true }
rustpython-pylib = { version = "0.4.0", features = ["freeze-stdlib"], optional = true }
# node:crypto real backends (src/extensions/runtime/host_functions/node_fns.rs):
# AES block primitives (CBC/CTR/GCM are implemented in that module on top of
# `aes`) and scrypt (password-hash/salsa20/pbkdf2 lines).
aes = { version = "0.8", optional = true }
scrypt = { version = "0.11", optional = true }
# SQLite backend for the node:sqlite (DatabaseSync) real shim and the
# better-sqlite3 virtual package shim (src/extensions/runtime/host_functions/
# sqlite_fns.rs). 0.32 rides the libsqlite3-sys 0.28 lock line rustpython-stdlib
# already carries (one bundled amalgamation build for the tree); `bundled`
# compiles SQLite in-process (FTS5/RTREE included) so the runtime needs no
# system sqlite3.dll — the exact gap that kept context-mode on the
# native-addon permanent boundary.
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
# Embedded bash-compatible shell (`brush`) behind the `brush` feature: when no
# external Git Bash / /bin/bash is installed, the bash tool can still run
# commands in-process via `pir __brush` rather than failing (an installed bash
# is preferred because it carries coreutils/PATH; on Windows a pool spawn costs
# ~300 ms per call, which the embedded fallback avoids). brush-core is the
# interpreter, brush-builtins the standard command set; both are pure Rust,
# MIT-licensed (the tree gains rpds' MPL-2.0 — see deny.toml). The `pir __brush`
# hidden subcommand hosts the persistent member the shell pool drives, so the
# pool's per-call script protocol is unchanged.
brush-core = { version = "0.5.0", optional = true }
brush-builtins = { version = "0.2.0", optional = true }

[features]
# Today's behavior = `full` (every feature, `image-protocol` included); the
# bin requires only `cli` (see `[[bin]]`). A minimal library build
# (`--no-default-features`) keeps only the core:
# ai/agent/agent_session/session_manager/config/compaction/skills/
# system_prompt/protocol/telemetry/logging/diagnostics/plugins(trait + light
# builtins)/coding_agent(json + the bash shell resolution the session and
# provider config-value executor share). The built-in tools are the seven
# per-tool leaves (`tool-read`, `tool-bash`, `tool-powershell`, `tool-edit`,
# `tool-write`, `tool-ls`, `tool-background`); the aggregate `tools` feature
# is exactly their union, and the independent `grep-find` leaf registers
# `grep`/`find` outside it. With every leaf AND `grep-find` off,
# `register_core_tools` is a no-op and `CORE_TOOL_NAMES` is empty.
# `compaction` and `telemetry` are core today —
# they are NOT cargo features yet (zero cfg sites), so no build can turn them
# off. `sdk` is optional and is NOT in the bare core: `pir::sdk` exists only
# when the `sdk` feature is enabled (no stub). Design: docs/FEATURES.md.
default = ["full"]
full = [
    "tui",
    "extensions",
    "python",
    "context-mode",
    "mcp",
    "env",
    "env-daemon",
    "server",
    "subagent",
    "tool-repair",
    "tool-search",
    "todo",
    "phone",
    "provider-openai",
    "provider-anthropic",
    "provider-google",
    "provider-bedrock",
    "provider-mistral",
    "cli",
    "tools",
    "grep-find",
    "image-tools",
    "image-protocol",
    "mcp-sd",
    "brush",
    "session",
    "skills",
    "sdk",
    "client",
]
# Default-on optional surfaces (user decision 2026-10-22: "except the agent
# loop, everything is an optional feature that is on by default"). `session`
# and `skills` keep their public data types and degrade to documented stubs, so
# a consumer that turns them off loses functionality but never a signature.
# `sdk` is different: it is a wholly optional facade — with it off `pir::sdk`
# is not compiled at all (there is no stub), so an embedder that uses the SDK
# enables the feature. `--no-default-features` leaves the agent loop +
# providers + tools + config compilable.
#   session     — upstream-format JSONL persistence, the tail-page reader and
#                 session discovery. Off: the agent runs with no transcript
#                 persistence (in-memory only).
session = []
#   skills      — skill discovery/loading (`src/skills.rs`). Off: skill loading
#                 reports the documented "disabled" diagnostic; the prompt
#                 renderer still compiles.
skills = []
#   sdk         — the curated embedding facade (`pir::sdk`). Off: the module
#                 is not compiled (no stub); embedders enable `sdk`.
sdk = []
# AI wire adapters: each feature gates one provider family's adapter module and
# its registry/construction arm. `provider-google` carries the Vertex
# service-account JWT (`rsa`), `provider-bedrock` the SigV4 signing (`hmac`);
# `extensions` needs both too (node:crypto), so they are shared, not owned.
provider-openai = ["dep:tokio-tungstenite"]
provider-anthropic = []
provider-google = ["dep:rsa"]
provider-bedrock = ["dep:hmac"]
provider-mistral = []
# The image attach path (read's inline images) and the AI layer's image-content
# helpers; there is no separate image tool. The TUI also uses the crate
# (settings menu, preview),
# but that is independent: `tui` does NOT enable read's attachment path, so
# `tui` without `image-tools` keeps the documented "type/size only" behavior.
image-tools = ["dep:image"]
# The clap-based CLI argument surface (`src/coding_agent/cli.rs`); the binary
# requires it, an SDK embed does not. `cli` implies the executable's front ends
# (`print`, `rpc`) and the session HTML exporter (`export-html`), so every
# `pir` binary keeps today's behavior; it deliberately does NOT imply `tools`
# (see below).
cli = ["dep:clap", "print", "rpc", "export-html"]
# `pir print` / the print-mode host (`src/coding_agent/print.rs`). Implied by
# `cli`; a library-only embed can enable it alone.
print = []
# `pir rpc` / the JSON-line host (`src/coding_agent/rpc.rs`). Implied by `cli`;
# a library-only embed can enable it alone. The `export_html` command is always
# on the wire surface: `rpc` without `export-html` answers the documented
# missing-feature error instead of silently dropping the command.
rpc = []
# Session → self-contained HTML (`src/coding_agent/export_html.rs`, `--export`
# and the TUI `/export`). Implied by `cli` and `tui`. NOT implied by `rpc`, so
# an `rpc`-only embed gets the runtime off-error (pinned by
# `tests/rpc_export_off.rs`) rather than losing the command silently.
export-html = []
# Per-tool gates. Each is a dependency-free leaf: a build can compile exactly
# one core tool (plus the shell/session plumbing that stays core) and
# `register_core_tools`/`CORE_TOOL_NAMES` reflect only the enabled leaves.
#   tool-read       — `read` (and the shared confinement/path helpers)
#   tool-bash       — the `bash` tool (`BashTool`); the bash module itself
#                     (`ShellConfig`, the shell pool, `ShellCapture`) stays
#                     core for the session/provider exec paths
#   tool-powershell — `powershell`
#   tool-edit       — `edit` (the TUI edit preview also compiles it)
#   tool-write      — `write`
#   tool-ls         — `ls`
#   tool-background — `background_status` + `background_abort`
tool-read = []
tool-bash = []
tool-powershell = []
tool-edit = []
tool-write = []
tool-ls = []
tool-background = []
# The aggregate built-in tools feature: a meta-feature over the seven leaves
# above (read/bash/powershell/edit/write/ls and the model-facing background
# controls), registered by `coding_agent::tools::register_core_tools`.
# Deliberately NOT implied by `cli`: `--features cli` is a real toolless binary
# (the session/RPC `execute_bash` path, prompt rendering and the shell-pool
# helpers stay core), and an explicit `--tools <core-name>` in that build emits
# the compiled-out diagnostic naming that tool's leaf feature. `tools` is in
# `full`, so the shipped binary is unchanged.
tools = [
    "tool-read",
    "tool-bash",
    "tool-powershell",
    "tool-edit",
    "tool-write",
    "tool-ls",
    "tool-background",
]
# `grep`/`find` tools and the ripgrep engine crates they run in-process
# (`env_daemon`'s directory listing shares `ignore` and carries `env` itself).
# An independent leaf: it does not pull the seven `tool-*` leaves (or the
# aggregate `tools` meta-feature) into the build, so a search-only embed can
# compile `grep`/`find` without read/bash/edit/write/ls/background.
grep-find = ["dep:grep-searcher", "dep:grep-regex", "dep:ignore"]

# Terminal UI: crossterm loop, editor, renderers, clipboard (arboard), grapheme
# segmentation, mermaid blocks, theme file watching (`notify`).
tui = [
    "dep:crossterm",
    "dep:image",
    "dep:crossterm_winapi",
    "dep:arboard",
    "dep:notify",
    "dep:unicode-segmentation",
    "dep:mermaid-text",
    # The TUI `/export` command renders a session through
    # `coding_agent::export_html`; the feature (and its module) follows.
    "export-html",
]
# Embedded QuickJS extension runtime (rquickjs + the swc transpile stack).
extensions = [
    "dep:rquickjs",
    # The `fs.watch` shim uses the native watcher when available (it also runs
    # under `tui`/`env`); without this an extensions-only build fell back to a
    # full-tree stat sweep every 200 ms.
    "dep:notify",
    # node:zlib / node:crypto host-function backends: the only users are the
    # engine's host fns and the node shims, so they ride this feature.
    "dep:flate2",
    "dep:brotli",
    "dep:zstd",
    "dep:aes",
    "dep:scrypt",
    "dep:md-5",
    "dep:sha1",
    "dep:pbkdf2",
    # node:crypto's RSA sign/verify and HMAC backends.
    "dep:rsa",
    "dep:hmac",
    # rusqlite rides the engine: node:sqlite's host functions live in the
    # runtime's host-fn table (see the `extensions` feature; there is no
    # separate `sqlite` feature).
    "dep:rusqlite",
    "dep:swc_ecma_parser",
    "dep:swc_ecma_codegen",
    "dep:swc_ecma_ast",
    "dep:swc_ecma_transforms_base",
    "dep:swc_ecma_transforms_typescript",
    "dep:swc_common",
]
# The `python` builtin tool (embedded RustPython 3).
python = ["dep:rustpython-vm", "dep:rustpython-stdlib", "dep:rustpython-pylib"]
# Embedded bash-compatible shell for the bash tool (`pir __brush` + the shell
# pool's brush member). Without it the tool spawns the external shell exactly
# as before; `shellPath` in settings still wins over brush.
brush = ["dep:brush-core", "dep:brush-builtins"]
# The `context-mode` builtin: Python scripts as a context-saving execution
# surface (only stdout enters the transcript) plus an FTS5/BM25 knowledge
# base. Reuses the embedded RustPython interpreter and rusqlite; the sqlite
# feature keeps the node:sqlite shims behind `extensions`, this feature pulls
# the same bundled SQLite for the index.
context-mode = ["python", "dep:rusqlite"]
# MCP client + the `mcp` builtin (rmcp 3.5). The builtin's tool-exposure and
# output-schema model is expressed through the codemode engine (its reach
# rules and `mcp_result_schema` live in `plugins::codemode`), so the feature
# carries `extensions`.
mcp = ["dep:rmcp", "extensions"]
# The built-in `sd` MCP server (`pir mcp-sd`, stdio): exposes a sed-style
# search & replace tool to any MCP client, including pir itself.
mcp-sd = ["mcp", "dep:ignore"]
# (No `sqlite` feature: the node:sqlite / better-sqlite3 shims are host
# functions *of* the extension engine and ride `extensions`, which pulls
# rusqlite. Splitting SQLite back out needs JS-side stubs; see docs/FEATURES.md §4.)
# The daemon's watch/list backend: the platform watcher (`notify`) and the
# `ignore` walker behind `listFiles`. After the `env-daemon` split its only
# compiled consumer is the daemon, and `env-daemon` implies it; `env` alone is
# a dependency-only row (no daemon, no ops). The daemon's wire data plane
# (`env_daemon::frame`/`decode`) stays core for the remote-env client.
env = ["dep:notify", "dep:ignore"]
# The daemon half of the env wire (`pir env-daemon serve`): the server, its
# exec/pty/file/list/watch ops and the platform `sys` layer. The data plane
# (`frame`/`decode`) and `env_daemon::DAEMON_SUBCOMMAND` stay core so the
# remote-env client and the `pir env-daemon` missing-feature arm compile in a
# build without the daemon. Implies `env` (watch/list backend).
env-daemon = ["env"]
# In-tree TCP/Unix server + client presets (no heavy dependencies).
server = []
# The remote protocol client (`pir::client`, `pir client`): the consumer half
# of the `server` wire, with no dependencies beyond the core protocol types.
# Off: `pir::client` does not exist (no stub) and `pir client` reports the
# missing feature instead of failing to compile.
client = []
# The `subagent` builtin (upstream's subagent example extension, ported
# natively): in-process child agent sessions with their own extension runtime.
# Absent in a build without the feature, so `builtin:subagent` reports the
# unknown-builtin error there.
subagent = []
# The `tool-repair` builtin (pi-tool-repair 0.3.6 ported natively): the
# assistant `message_end` repair pipeline plus the `before_provider_request`
# schema sanitizer. This gates the builtin's registration (its factory entry
# and plugin type); the pure repair core stays compiled because the core
# session's repair seam (`agent_session/tool_repair.rs`) names it.
tool-repair = []
# The `tool-search` builtin (upstream extensions/tool-search): BM25 search
# over the not-yet-active tools, loading the matches into the active set.
# Absent in a build without the feature, so `builtin:tool-search` reports the
# unknown-builtin error there.
tool-search = []
# The `todo` builtin (the npm `@juicesharp/rpiv-todo` package ported natively):
# the model-facing `todo` task list plus the `/todos` command, rebuilt from the
# session transcript so it survives `/reload`, resume and compaction. Absent in
# a build without the feature, so `builtin:todo` reports the unknown-builtin
# error there.
todo = []
# pi-phone ported natively: the phone-first remote UI (HTTP+WS server, session
# mirror, parallel RPC sessions, Tailscale). Compiled into `full` but DEFAULT
# OFF on the extension plan (`BuiltinExtensionDef::default_enabled: false`):
# it binds a local port and holds a server task. sha1 is the WS handshake;
# flate2 (already linked for node:zlib, pure-Rust miniz backend) serves the
# embedded UI gzip-encoded.
phone = ["dep:sha1", "dep:flate2", "dep:tokio-tungstenite"]
# The halfblocks image preview renderer in the TUI (`src/tui/image_preview.rs`).
# The `image` crate comes with `tui` or `image-tools`; this feature gates the
# renderer on top of that. It is part of `full` (default-on, so the preview
# works out of the box) but independently disableable in a slim TUI build:
# with it off, `terminal.showImages: true` renders the `[Image: ...]` text
# fallback instead of halfblocks.
image-protocol = ["tui"]

# Quality gates: CI runs `cargo clippy --all-targets --all-features -- -D
# warnings`, so every `warn` entry here is a build gate. The pedantic picks
# below were chosen conservatively (verified silent on the current tree):
# `disallowed-methods`/`disallowed-types` ship with an empty config list and
# are pure extension points; `wildcard_dependencies`/`negative_feature_names`
# only read Cargo.toml (no "*" version reqs, no negated feature names).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
disallowed_methods = "warn"
disallowed_types = "warn"
wildcard_dependencies = "warn"
negative_feature_names = "warn"
# clippy 1.99.1 false positive: it reports `thread_local!` initializers as
# non-const even when they are already written as `const { ... }` (reproduced
# with a minimal `clippy-driver` file). Remove when the toolchain is updated.
missing_const_for_thread_local = "allow"

# Process-group kill for stdio MCP servers (upstream killProcessTree on Unix).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The musl release has no system OpenSSL; native-tls -> openssl-sys must build
# its own against musl-gcc. This is target-scoped so glibc builds keep using
# the platform library.
[target.'cfg(target_env = "musl")'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

# Shell-tool process-tree kill (upstream killProcessTree on Windows): the
# child runs in a Job Object so abort/timeout reach every descendant;
# `taskkill /T /F` stays the fallback. Zero-transitive-dependency crate (only
# windows-targets, already in the tree).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    # CreateJobObjectW is gated behind Win32_Security (SECURITY_ATTRIBUTES).
    "Win32_Security",
    "Win32_System_JobObjects",
    # Win32_System_Threading was audited out: the only Job Object calls used
    # (CreateJobObjectW/AssignProcessToJobObject/TerminateJobObject) reference
    # types from Win32_Foundation (HANDLE) and Win32_Security only.
    # Re-added for `pir env-daemon` (src/env_daemon/sys/windows.rs):
    # CREATE_NO_WINDOW for hidden child processes and taskkill.
    "Win32_System_Threading",
    # `pir env-daemon` file ops: CreateFileW/GetFileInformationByHandle/
    # MoveFileExW and the BY_HANDLE_FILE_INFORMATION identity probe.
    "Win32_Storage_FileSystem",
    # CancelSynchronousIo, so a pipe reader blocked in ReadFile wakes up and
    # closes its pipe when a command settles (upstream sys/windows.rs).
    "Win32_System_IO",
    # Native Shift+Enter detection (GetAsyncKeyState) in src/tui/stdin_buffer.rs.
    "Win32_UI_Input_KeyboardAndMouse",
] }
# The upstream `enableWindowsVTInput` port (src/tui/stdin_buffer.rs) reaches
# GetConsoleMode/SetConsoleMode through the safe wrappers crossterm already
# depends on (the workspace denies `unsafe_code`, so the raw Win32 calls are
# not available to us). Same 0.9 line the lock already carries.
crossterm_winapi = { version = "0.9", optional = true }

[dev-dependencies]
criterion = "0.5"
# Provider-adapter test modernization: insta golden snapshots + proptest for
# SSE chunk-boundary robustness (quality wave Q9).
insta = { version = "1", features = ["json"] }
proptest = "1"

[package.metadata.cargo-machete]
# The package is `md-5`; the code imports its crate as `md5` (node:crypto
# hash/hmac backend), which cargo-machete cannot see as a package use.
# `openssl-sys` is target-only: the musl release enables its `vendored` feature
# for native-tls, with no Rust-side import.
ignored = ["md-5", "openssl-sys"]

# Criterion owns `main` (its own runner + report); without `harness = false`
# cargo compiles the bench under libtest and runs 0 benchmarks.
[[bench]]
name = "benchmark"
harness = false

# Size posture, measured (Q55): the default release profile is fat LTO + one
# codegen unit + `strip = true`. Same-source A/B against the control shape:
# 82,649,600 B vs 95,676,416 B — a 13.62% smaller executable (evidence:
# logs/w18-help/q55/; recorded in docs/STATUS.md and docs/w19-north-star.md).
# The trade is build time: fat LTO + one CGU serializes the final link, which
# is why the opt-in `release-balanced` (opt-level 2; another −3.46% at a small
# JS/Python wall cost) and `release-size` profiles below exist for iteration
# and size-first builds. `strip` drops symbols from the shipped binary at zero
# compile-time cost.
[profile.release]
opt-level = 3
# Size without behaviour change: fat LTO + one codegen unit let LLVM
# cross-crate inline and fold identical code, which is where most of the
# remaining ~81 MiB went. Deliberately NOT used: `panic = "abort"` (both
# `extensions/runtime/host_functions/worker_fns.rs` and `tui/autocomplete.rs`
# contain a panicking boundary, and `coding_agent/crash_log.rs` installs a
# `panic::set_hook`, so unwinding is load-bearing). `strip = true` removes
# symbols only. The opt-in `release-size` profile below applies `opt-level =
# "s"` only to cold code and keeps the interpreters at 3; `release-balanced`
# uses opt-level 2 uniformly. The default keeps opt-level 3 for throughput.
lto = "fat"
codegen-units = 1
strip = true

# Size-first profile: identical features and behaviour, LLVM optimizes for
# size. Build with `cargo build --profile release-size --bin pir`; the measured
# delta and its throughput trade are recorded in logs/w18-help/q55/.
#
# The hot execution crates stay at opt-level 3: a pure `"s"` build is ~29%
# smaller but costs ~85% on JavaScript loops and ~22% on Python loops, almost
# all of it in the QuickJS C runtime and the RustPython VM/stdlib. Keeping
# those (plus our own crate, the async runtime and the grep stack) at 3
# preserves the interactive paths while the cold bulk (swc, brush, image,
# HTTP/TLS, MCP) still gets the size win.
[profile.release-size]
inherits = "release"
opt-level = "s"

[profile.release-size.package.pir-sdk]
opt-level = 3

[profile.release-size.package.rustpython-vm]
opt-level = 3
[profile.release-size.package.rustpython-stdlib]
opt-level = 3
[profile.release-size.package.rustpython-common]
opt-level = 3
[profile.release-size.package.rustpython-format]
opt-level = 3
[profile.release-size.package.rustpython-sre_engine]
opt-level = 3

[profile.release-size.package.malachite]
opt-level = 3
[profile.release-size.package.malachite-base]
opt-level = 3
[profile.release-size.package.malachite-bigint]
opt-level = 3
[profile.release-size.package.malachite-nz]
opt-level = 3
[profile.release-size.package.malachite-q]
opt-level = 3

[profile.release-size.package.rquickjs]
opt-level = 3
[profile.release-size.package.rquickjs-core]
opt-level = 3
[profile.release-size.package.rquickjs-sys]
opt-level = 3

[profile.release-size.package.regex]
opt-level = 3
[profile.release-size.package.regex-automata]
opt-level = 3
[profile.release-size.package.regex-syntax]
opt-level = 3
[profile.release-size.package.memchr]
opt-level = 3
[profile.release-size.package.grep-matcher]
opt-level = 3
[profile.release-size.package.grep-regex]
opt-level = 3
[profile.release-size.package.grep-searcher]
opt-level = 3
[profile.release-size.package.ignore]
opt-level = 3
[profile.release-size.package.globset]
opt-level = 3

[profile.release-size.package.serde_json]
opt-level = 3
[profile.release-size.package.tokio]
opt-level = 3

# Middle ground: every crate at opt-level 2. Measured at 79,790,080 B
# (−3.46% vs release) with JavaScript +4.1% wall and Python +1.2% wall, so it
# is the safer choice when the embedded JS/Python loops matter more than the
# last two megabytes. Evidence: logs/w18-help/q55/SIZE-TUNE-REPORT.md.
[profile.release-balanced]
inherits = "release"
opt-level = 2

# No debuginfo in dev: the crate links ~99 test binaries, and line tables
# pushed each to ~80 MB — a lib edit (including any `.js.txt` include_str!)
# meant re-linking ~8 GB, dominating the edit-test loop. Panic locations and
# assert messages are unaffected (they are compiled-in constants); only
# RUST_BACKTRACE symbolization loses file:line. Raise to 1/2 when chasing a
# crash that needs symbolized backtraces.
[profile.dev]
opt-level = 0
debug = 0
